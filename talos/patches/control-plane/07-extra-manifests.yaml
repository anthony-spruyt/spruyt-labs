# Bootstrap seeds. Talos creates these once and never updates them, so bumping
# a URL here has no effect on a running cluster. Each tag is annotated so
# Renovate keeps it in lockstep with the GitRepository or chart that owns the
# same CRDs at runtime.
cluster:
  extraManifests:
    # renovate: depName=kubernetes-sigs/gateway-api datasource=github-tags
    - https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/experimental-install.yaml
    # renovate: depName=kubernetes-csi/external-snapshotter datasource=github-tags
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
    # renovate: depName=kubernetes-csi/external-snapshotter datasource=github-tags
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
    # renovate: depName=kubernetes-csi/external-snapshotter datasource=github-tags
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
    # renovate: depName=kubernetes-csi/external-snapshotter datasource=github-tags
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshotclasses.yaml
    # renovate: depName=kubernetes-csi/external-snapshotter datasource=github-tags
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshotcontents.yaml
    # renovate: depName=kubernetes-csi/external-snapshotter datasource=github-tags
    - https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.6.0/client/config/crd/groupsnapshot.storage.k8s.io_volumegroupsnapshots.yaml
    # renovate: depName=csi-addons/kubernetes-csi-addons datasource=github-tags
    - https://raw.githubusercontent.com/csi-addons/kubernetes-csi-addons/v0.15.0/deploy/controller/crds.yaml
    # renovate: depName=kubernetes/autoscaler datasource=github-tags versioning=regex:^vertical-pod-autoscaler-(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
    - https://raw.githubusercontent.com/kubernetes/autoscaler/vertical-pod-autoscaler-1.7.1/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml
