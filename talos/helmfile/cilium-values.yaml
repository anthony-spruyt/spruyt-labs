---
# yaml-language-server: $schema=https://raw.githubusercontent.com/giantswarm/cilium-app/main/helm/cilium/values.schema.json
# Cilium Helm Reference -> https://docs.cilium.io/en/stable/helm-reference/
# Default values for cilium: https://raw.githubusercontent.com/giantswarm/cilium-app/main/helm/cilium/values.yaml
policyEnforcementMode: "never"
debug:
  enabled: true
kubeProxyReplacement: true
# No kube-proxy, so the agent reaches the API server through KubePrism (talos/patches/all/10-enable-kube-prism.yaml)
k8sServiceHost: localhost
k8sServicePort: 7445
bpf:
  masquerade: true
enableIPv4Masquerade: true
ipMasqAgent:
  enabled: true
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
ipam:
  mode: "kubernetes"
operator:
  replicas: 1
  rollOutPods: false
gatewayAPI:
  enabled: true
  enableAlpn: true
  enableAppProtocol: true
# Overrides the chart list to drop SYS_MODULE, which Talos does not grant to pods
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mountCgroup:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
    applySysctlOverwrites:
      - SYS_ADMIN
      - SYS_CHROOT
      - SYS_PTRACE
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
