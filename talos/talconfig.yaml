---
# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json

# renovate: depName=ghcr.io/siderolabs/installer datasource=docker
talosVersion: v1.13.9
# renovate: depName=ghcr.io/siderolabs/kubelet datasource=docker
kubernetesVersion: v1.36.4

clusterName: ${CLUSTER_NAME}
domain: ${CLUSTER_DOMAIN}
endpoint: "https://${KUBEAPI_VIP}:6443"
#endpoint: "https://${E2_3_IP4}:6443"
allowSchedulingOnControlPlanes: false
cniConfig:
  name: none # Cilium
clusterPodNets:
  - ${CLUSTER_POD_CIDR_IP4}
clusterSvcNets:
  - ${CLUSTER_SVC_CIDR_IP4}
additionalApiServerCertSans:
  - ${E2_1_IP4}
  - ${E2_2_IP4}
  - ${E2_3_IP4}
  - ${MS_01_1_IP4}
  - ${MS_01_2_IP4}
  - ${MS_01_3_IP4}
  - 127.0.0.1 # KubePrism
additionalMachineCertSans:
  - ${KUBEAPI_VIP}
  - ${E2_1_IP4}
  - ${E2_2_IP4}
  - ${E2_3_IP4}
  - ${MS_01_1_IP4}
  - ${MS_01_2_IP4}
  - ${MS_01_3_IP4}
  - 127.0.0.1 # KubePrism

# Patch list order is load-bearing: talhelper appends each patch's Talos documents in the
# order they are applied - role, then node, then global - and talosctl diffs config
# textually. Reordering these lists changes the rendered output even when nothing semantic
# changes, and a udev rule reorder alone turns a reboot-free apply into a reboot.
nodes:
  - hostname: e2-1
    controlPlane: true
    # Duplicated in @patches/node/e2-1/configure-install-disk.yaml, which wins - patches
    # apply last. Edit both; genconfig.sh refuses to render if they disagree.
    installDiskSelector:
      serial: 50026B76874DDE95 # Kinston
      # serial: P300ADBB25032802523 # Patriot
    ipAddress: ${E2_1_IP4}
    machineSpec:
      mode: metal
      arch: amd64
      secureboot: true
      useUKI: true
    nodeAnnotations: &e2NodeAnnotations
      installerImage: "{{ .MachineConfig.MachineInstall.InstallImage }}"
    patches:
      - "@patches/node/e2-1/configure-install-disk.yaml"
      - "@patches/node/e2-1/configure-vlan.yaml"
    schematic: &e2Schematic
      customization:
        secureboot:
          includeWellKnownCertificates: true
        extraKernelArgs:
          - -lockdown # Secure boot lockdown needs updating
          - lockdown=integrity # to integrity for Cilium
          - quiet # Reduce noise
          - loglevel=3 # Reduce noise
          - amd_pstate=1 # Enable AMD CPU boost
          - pcie_aspm=off # Stop link ASPM transitions
          - pci=pcie_bus_perf # Set device MPS to the largest allowable MPS based on its parent bus.
          - nvme_core.default_ps_maxlatency_us=0 # Prevent entering low PS
          - iommu=pt # PCI Passthrough
          - idle=nomwait # Prevent deep CPU idle states
        systemExtensions:
          officialExtensions:
            - siderolabs/amd-ucode
            - siderolabs/lldpd
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
  - hostname: e2-2
    controlPlane: true
    # Duplicated in @patches/node/e2-2/configure-install-disk.yaml, which wins - edit both
    installDiskSelector:
      serial: P300ADBB25032802429
    ipAddress: ${E2_2_IP4}
    machineSpec:
      mode: metal
      arch: amd64
      secureboot: true
      useUKI: true
    nodeAnnotations: *e2NodeAnnotations
    patches:
      - "@patches/node/e2-2/configure-install-disk.yaml"
      - "@patches/node/e2-2/configure-vlan.yaml"
    schematic: *e2Schematic
  - hostname: e2-3
    controlPlane: true
    # Duplicated in @patches/node/e2-3/configure-install-disk.yaml, which wins - edit both
    installDiskSelector:
      serial: P300ADBB25032803816
    ipAddress: ${E2_3_IP4}
    machineSpec:
      mode: metal
      arch: amd64
      secureboot: true
      useUKI: true
    nodeAnnotations: *e2NodeAnnotations
    patches:
      - "@patches/node/e2-3/configure-install-disk.yaml"
      - "@patches/node/e2-3/configure-vlan.yaml"
    schematic: *e2Schematic
  - hostname: ms-01-1
    controlPlane: false
    # Duplicated in @patches/node/ms-01-1/configure-install-disk.yaml, which wins - edit both
    installDiskSelector:
      serial: MQ11W14606696
    ipAddress: ${MS_01_1_IP4}
    machineSpec:
      mode: metal
      arch: amd64
      secureboot: true
      useUKI: true
    nodeAnnotations: &ms01NodeAnnotations
      installerImage: "{{ .MachineConfig.MachineInstall.InstallImage }}"
    patches:
      - "@patches/node/ms-01-1/configure-install-disk.yaml"
      - "@patches/node/ms-01-1/configure-thunderbolt-links.yaml"
      - "@patches/node/ms-01-1/configure-vlan.yaml"
      - "@patches/node/ms-01-1/enable-ups-access.yaml"
    schematic: &ms01Scehmatic
      customization:
        secureboot:
          includeWellKnownCertificates: true
        extraKernelArgs:
          - -lockdown # Secure boot lockdown needs updating
          - lockdown=integrity # to integrity for Cilium
          - quiet # Reduce noise
          - loglevel=3 # Reduce noise
          - intel_iommu=on # PCI Passthrough
          - iommu=pt # PCI Passthrough
          - net.ifnames=0 # Thunderbolt ring https://gist.github.com/gavinmcfall/ea6cb1233d3a300e9f44caf65a32d519
        systemExtensions:
          officialExtensions:
            - siderolabs/i915
            - siderolabs/intel-ucode
            - siderolabs/kata-containers
            - siderolabs/lldpd
            - siderolabs/thunderbolt
            - siderolabs/iscsi-tools
            - siderolabs/util-linux-tools
  - hostname: ms-01-2
    controlPlane: false
    # Duplicated in @patches/node/ms-01-2/configure-install-disk.yaml, which wins - edit both
    installDiskSelector:
      serial: MP46W15115349
    ipAddress: ${MS_01_2_IP4}
    machineSpec:
      mode: metal
      arch: amd64
      secureboot: true
      useUKI: true
    nodeAnnotations: *ms01NodeAnnotations
    patches:
      - "@patches/node/ms-01-2/configure-install-disk.yaml"
      - "@patches/node/ms-01-2/configure-thunderbolt-links.yaml"
      - "@patches/node/ms-01-2/configure-vlan.yaml"
    schematic: *ms01Scehmatic
  - hostname: ms-01-3
    controlPlane: false
    # Duplicated in @patches/node/ms-01-3/configure-install-disk.yaml, which wins - edit both
    installDiskSelector:
      serial: MQ19B55500378
    ipAddress: ${MS_01_3_IP4}
    machineSpec:
      mode: metal
      arch: amd64
      secureboot: true
      useUKI: true
    nodeAnnotations: *ms01NodeAnnotations
    patches:
      - "@patches/node/ms-01-3/configure-install-disk.yaml"
      - "@patches/node/ms-01-3/configure-thunderbolt-links.yaml"
      - "@patches/node/ms-01-3/configure-vlan.yaml"
    schematic: *ms01Scehmatic

controlPlane:
  disableSearchDomain: &disableSearchDomain true
  extensionServices: &extensionServices
    - name: lldpd
      configFiles:
        - content: |
            configure lldpd portidsubtype ifname
            configure system description "Talos Node"
          mountPath: /usr/local/etc/lldpd/lldpd.conf
  nameservers: &nameservers
    - ${DNS_1}
    - ${DNS_2}
  nodeLabels:
    node-role.kubernetes.io/control-plane: ""
    bgp: "65050"

  patches:
    - "@patches/control-plane/configure-etcd.yaml"
    - "@patches/control-plane/configure-pod-gc.yaml"
    - "@patches/control-plane/configure-scheduler-for-spegel.yaml"
    - "@patches/control-plane/disable-admissions-plugins.yaml"
    - "@patches/control-plane/configure-api-server.yaml"
    - "@patches/control-plane/expose-metrics.yaml"
    - "@patches/control-plane/extra-manifests.yaml"
    - "@patches/control-plane/enable-talos-api-access.yaml"
    - "@patches/control-plane/tune-disk-writeback.yaml"
    # Applies to every node, but talhelper applies the global list last, which would put
    # this udev rule after the node-level ones. Referenced per role to keep rule order.
    - "@patches/global/tune-disk-scheduler.yaml"
    - "@patches/control-plane/resources.yaml"
    - "@patches/control-plane/encrypt-volumes.yaml"
    - "@patches/control-plane/configure-vip.yaml"
    - "@patches/control-plane/configure-link.yaml"
    - "@patches/control-plane/disable-ipv6-autoconf.yaml"

worker:
  disableSearchDomain: *disableSearchDomain
  extensionServices: *extensionServices
  nameservers: *nameservers

  patches:
    - "@patches/worker/load-thunderbolt-modules.yaml"
    - "@patches/worker/tune-networking.yaml"
    - "@patches/worker/enable-cpu-boost.yaml"
    - "@patches/worker/enable-gpu-passthrough.yaml"
    - "@patches/worker/authorize-thunderbolt.yaml"
    - "@patches/worker/tune-tx-queue.yaml"
    # Per-role rather than in the global list - see the note on the control plane list
    - "@patches/global/tune-disk-scheduler.yaml"
    - "@patches/worker/configure-node-labels.yaml"
    - "@patches/worker/encrypt-volumes.yaml"
    - "@patches/worker/configure-thunderbolt-aliases.yaml"
    - "@patches/worker/configure-link.yaml"

patches:
  - "@patches/global/configure-containerd.yaml"
  - "@patches/global/configure-kubelet.yaml"
  - "@patches/global/configure-registries.yaml"
  - "@patches/global/configure-ntp.yaml"
  - "@patches/global/disable-kube-proxy-for-cilium.yaml"
  - "@patches/global/enable-kube-prism.yaml"
  - "@patches/global/host-dns-for-cilium.yaml"
  - "@patches/global/wipe-disks-on-install.yaml"
  - "@patches/global/increase-vm-for-es.yaml"
