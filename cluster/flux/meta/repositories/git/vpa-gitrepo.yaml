---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/gitrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: vpa-gitrepo
  namespace: flux-system
spec:
  interval: 12h
  timeout: 3m
  url: https://github.com/kubernetes/autoscaler
  ref:
    tag: vertical-pod-autoscaler-1.6.0
  sparseCheckout:
    - vertical-pod-autoscaler/deploy
  # Allowlist vpa-v1-crd-gen.yaml. The deploy directory also holds the
  # deprecated beta CRDs and a kustomization.yaml that would take precedence
  # over auto-generation and pull in the controller deployments and RBAC.
  ignore: |
    /*
    !/vertical-pod-autoscaler
    /vertical-pod-autoscaler/*
    !/vertical-pod-autoscaler/deploy
    /vertical-pod-autoscaler/deploy/*
    !/vertical-pod-autoscaler/deploy/vpa-v1-crd-gen.yaml
