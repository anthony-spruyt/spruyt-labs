---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/imagevalidatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-litellm-image
  annotations:
    policies.kyverno.io/title: Verify LiteLLM Image Signatures
    policies.kyverno.io/category: Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      ghcr.io/berriai/litellm* images in pods in the litellm namespace must
      carry a keyless cosign signature from upstream's release workflow:
      the GitHub Actions issuer and the BerriAI/project-releaser release.yml
      workflow on main.
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  webhookConfiguration:
    # The VMRule matches this policy's finegrained webhook name, which exists only while timeoutSeconds is set
    timeoutSeconds: 15
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [litellm]
  autogen:
    podControllers:
      # Pods only: the default autogen would send every ReplicaSet scale update through the registry check
      controllers: []
  validationConfigurations:
    # Images are digest-pinned; leaving the default on adds a second, mutating webhook
    mutateDigest: false
  matchImageReferences:
    - glob: ghcr.io/berriai/litellm*
  attestors:
    - name: cosign
      cosign:
        keyless:
          identities:
            - issuer: https://token.actions.githubusercontent.com
              subject: https://github.com/BerriAI/project-releaser/.github/workflows/release.yml@refs/heads/main
          additionalExtensions:
            githubWorkflowRepository: BerriAI/project-releaser
  validations:
    - expression: >-
        images.containers.map(image, verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: "LiteLLM images must carry a keyless cosign signature from upstream's release workflow: the GitHub Actions issuer and the BerriAI/project-releaser release.yml workflow on main"
