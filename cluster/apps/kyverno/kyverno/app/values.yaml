---
# #yaml-language-server: $schema=TODO
# Documentation: https://github.com/kyverno/kyverno/blob/main/charts/kyverno/README.md
# Default values: https://github.com/kyverno/kyverno/blob/main/charts/kyverno/values.yaml

config:
  matchConditions:
    # Recovery must start these pods while Kyverno is down
    - name: skip-boot-critical-pods
      expression: "!(request.kind.group == '' && request.kind.kind == 'Pod' && request.namespace in ['rook-ceph', 'nut-system'])"

admissionController:
  # Enable CRD watcher so Kyverno discovers CRD-based resources (e.g. HelmRelease)
  # and registers them in its admission webhook
  crdWatcher: true
  priorityClassName: critical-infrastructure
  replicas: 1
  container:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  serviceMonitor:
    enabled: true

backgroundController:
  priorityClassName: critical-infrastructure
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true

cleanupController:
  priorityClassName: critical-infrastructure
  replicas: 1
  rbac:
    clusterRole:
      extraResources:
        - apiGroups:
            - ""
          resources:
            - pods
          verbs:
            - delete
            - get
            - list
            - watch
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  serviceMonitor:
    enabled: true

reportsController:
  priorityClassName: critical-infrastructure
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  serviceMonitor:
    enabled: true
