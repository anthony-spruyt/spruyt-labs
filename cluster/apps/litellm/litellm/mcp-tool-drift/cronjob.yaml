---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-mcp-tool-drift
  namespace: litellm
spec:
  schedule: "17 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: litellm-mcp-tool-drift
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          priorityClassName: standard
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: drift
              image: alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
                readOnlyRootFilesystem: true
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {cpu: 100m, memory: 128Mi}
              env:
                - name: MODE
                  value: enforce
                - name: LITELLM_URL
                  value: "http://litellm.litellm.svc.cluster.local:4000"
                - name: LITELLM_MASTER_KEY
                  valueFrom: {secretKeyRef: {name: litellm-secrets, key: LITELLM_MASTER_KEY}}
                - name: GITHUB_TOKEN
                  valueFrom: {secretKeyRef: {name: litellm-github-credentials, key: github-token, optional: true}}
                - name: CONFIG_FILE
                  value: /litellm-config/config.yaml
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
              command: ["python3", "/scripts/drift.py"]
              volumeMounts:
                - {name: script, mountPath: /scripts, readOnly: true}
                - {name: litellm-config, mountPath: /litellm-config, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: script
              configMap:
                name: litellm-mcp-tool-drift-script
            - name: litellm-config
              configMap:
                name: litellm-litellm-config
            - name: tmp
              emptyDir: {}
