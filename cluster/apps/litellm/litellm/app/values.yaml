        model_list:
          # --------------------------------------------------------------------------
          # Openrouter: PAYG
          # --------------------------------------------------------------------------
          - model_name: "openrouter/free"
            litellm_params:
              model: "openrouter/free"
              api_key: os.environ/OPENROUTER_API_KEY
              input_cost_per_token: 0.0
              output_cost_per_token: 0.0
          - model_name: "openrouter/x-ai/grok-4.6"
            litellm_params:
              model: "openrouter/x-ai/grok-4.6"
              api_key: os.environ/OPENROUTER_API_KEY
              input_cost_per_token: 0.000002
              output_cost_per_token: 0.000006
          - model_name: "openrouter/anthropic/claude-haiku-5.5"
            litellm_params:
              model: "openrouter/anthropic/claude-haiku-5.5"
              api_key: os.environ/OPENROUTER_API_KEY
              input_cost_per_token: 0.0000001
              output_cost_per_token: 0.0000005
          # --------------------------------------------------------------------------
          # Anthropic: Subscription
          # --------------------------------------------------------------------------
          # stream_timeout is the per-read idle limit - a stalled upstream otherwise holds the stream 600s
          - model_name: "anthropic/claude-fable-5"
            litellm_params:
              model: "anthropic/claude-fable-5"
              stream_timeout: 120
          - model_name: "anthropic/claude-fable-5-1"
            litellm_params:
              model: "anthropic/claude-fable-5-1"
              stream_timeout: 120
          - model_name: "anthropic/claude-opus-5-5"
            litellm_params:
              model: "anthropic/claude-opus-5-5"
              stream_timeout: 120
          - model_name: "anthropic/claude-sonnet-5-5"
            litellm_params:
              model: "anthropic/claude-sonnet-5-5"
              stream_timeout: 120
          - model_name: "anthropic/claude-haiku-5-5"
            litellm_params:
              model: "anthropic/claude-haiku-5-5"
              stream_timeout: 120
          # Catch-alls for Opus/Sonnet/Haiku names clients can't change - only reached when no alias or exact name matches
          - model_name: "*claude*opus*"
            litellm_params:
              model: "anthropic/claude-opus-5-5"
              stream_timeout: 120
          - model_name: "*claude*sonnet*"
            litellm_params:
              model: "anthropic/claude-sonnet-5-5"
              stream_timeout: 120
          - model_name: "*claude*haiku*"
            litellm_params:
              model: "anthropic/claude-haiku-5-5"
              stream_timeout: 120
          # --------------------------------------------------------------------------
          # Anthropic: API key (fallback when the subscription is exhausted)
          # --------------------------------------------------------------------------
          - model_name: "anthropic-api/claude-fable-5"
            litellm_params:
              model: "anthropic/claude-fable-5"
              api_key: os.environ/ANTHROPIC_API_KEY
              stream_timeout: 120
          - model_name: "anthropic-api/claude-fable-5-1"
            litellm_params:
              model: "anthropic/claude-fable-5-1"
              api_key: os.environ/ANTHROPIC_API_KEY
              stream_timeout: 120
          - model_name: "anthropic-api/claude-opus-5-5"
            litellm_params:
              model: "anthropic/claude-opus-5-5"
              api_key: os.environ/ANTHROPIC_API_KEY
              stream_timeout: 120
          - model_name: "anthropic-api/claude-sonnet-5-5"
            litellm_params:
              model: "anthropic/claude-sonnet-5-5"
              api_key: os.environ/ANTHROPIC_API_KEY
              stream_timeout: 120
          - model_name: "anthropic-api/claude-haiku-5-5"
            litellm_params:
              model: "anthropic/claude-haiku-5-5"
              api_key: os.environ/ANTHROPIC_API_KEY
              stream_timeout: 120
          # --------------------------------------------------------------------------
          # OpenAI: PAYG
          # --------------------------------------------------------------------------
          - model_name: "openai/gpt-4o-mini"
            litellm_params:
              model: "openai/gpt-4o-mini"
              api_key: os.environ/OPENAI_API_KEY
          - model_name: "openai/text-embedding-3-small"
            litellm_params:
              model: "text-embedding-3-small"
              api_key: os.environ/OPENAI_API_KEY
          # --------------------------------------------------------------------------
          # Auto router: TypeSafe Jev classifier
          # --------------------------------------------------------------------------
          - model_name: "jev-router"
            litellm_params:
              model: "auto_router/complexity_router"
              complexity_router_default_model: "anthropic/claude-sonnet-5-5"
              complexity_router_config:
                tiers:
                  SIMPLE: "anthropic/claude-haiku-5-5"
                  MEDIUM: "anthropic/claude-sonnet-5-5"
                  COMPLEX: "anthropic/claude-opus-5-5"
                  REASONING: "anthropic/claude-fable-5-1"
                classifier_type: jev
                jev_classifier_config:
                  model: jev-latest
                  timeout_ms: 3000
                # Replays the held tier on tool-result turns - no mid-loop model switches
                classification_mode: user_turn
        router_settings:
          enable_weighted_failover: true
          fallbacks:
            - "anthropic/claude-fable-5": ["anthropic-api/claude-fable-5"]
            - "anthropic/claude-fable-5-1": ["anthropic-api/claude-fable-5-1"]
            - "anthropic/claude-opus-5-5": ["anthropic-api/claude-opus-5-5"]
            - "anthropic/claude-sonnet-5-5": ["anthropic-api/claude-sonnet-5-5"]
            - "anthropic/claude-haiku-5-5": ["anthropic-api/claude-haiku-5-5"]
            - "claude-opus-5": ["anthropic-api/claude-opus-5-5"]
            - "anthropic/claude-opus-5": ["anthropic-api/claude-opus-5-5"]
            - "claude-sonnet-5": ["anthropic-api/claude-sonnet-5-5"]
            - "anthropic/claude-sonnet-5": ["anthropic-api/claude-sonnet-5-5"]
            - "claude-haiku-4-5": ["anthropic-api/claude-haiku-5-5"]
            - "claude-haiku-4-5-20251001": ["anthropic-api/claude-haiku-5-5"]
            - "anthropic/claude-haiku-4-5": ["anthropic-api/claude-haiku-5-5"]
          model_group_alias:
            "claude-haiku-4-5": "anthropic/claude-haiku-5-5"
            "claude-haiku-4-5-20251001": "anthropic/claude-haiku-5-5"
            "anthropic/claude-haiku-4-5": "anthropic/claude-haiku-5-5"
            "claude-haiku-5-5": "anthropic/claude-haiku-5-5"
            "claude-sonnet-5": "anthropic/claude-sonnet-5-5"
            "anthropic/claude-sonnet-5": "anthropic/claude-sonnet-5-5"
            "claude-sonnet-5-5": "anthropic/claude-sonnet-5-5"
            "claude-opus-5": "anthropic/claude-opus-5-5"
            "anthropic/claude-opus-5": "anthropic/claude-opus-5-5"
            "claude-opus-5-5": "anthropic/claude-opus-5-5"
            "claude-fable-5": "anthropic/claude-fable-5"
            "claude-fable-5-1": "anthropic/claude-fable-5-1"
          redis_host: litellm-valkey.litellm.svc
          redis_port: "6379"
          redis_password: os.environ/REDIS_PASSWORD
          routing_strategy: simple-shuffle
        search_tools:
          - search_tool_name: brave-search
            litellm_params:
              search_provider: brave
              api_key: os.environ/BRAVE_API_KEY
          - search_tool_name: firecrawl-search
            litellm_params:
              search_provider: firecrawl
              api_key: os.environ/FIRECRAWL_API_KEY

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  config:
    type: configMap
    identifier: litellm-config
    advancedMounts:
      litellm:
        litellm:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
  presidio-recognizers-config:
    type: configMap
    identifier: presidio-recognizers
    advancedMounts:
      presidio-analyzer:
        presidio-analyzer:
          - path: /opt/presidio/conf/recognizers.yaml
            subPath: recognizers.yaml
            readOnly: true
  presidio-analyzer-cache:
    type: emptyDir
    advancedMounts:
      presidio-analyzer:
        presidio-analyzer:
          - path: /home/presidio/.cache
  presidio-anonymizer-cache:
    type: emptyDir
    advancedMounts:
      presidio-anonymizer:
        presidio-anonymizer:
          - path: /home/presidio/.cache
  llm-guard-scanners-config:
    type: configMap
    identifier: llm-guard-scanners
    advancedMounts:
      llm-guard:
        llm-guard:
          - path: /config/scanners.yml
            subPath: scanners.yml
            readOnly: true
  # HF_HOME for llm-guard; loaded offline, refill by removing HF_HUB_OFFLINE (see README)
  llm-guard-hf-cache:
    type: persistentVolumeClaim
    existingClaim: llm-guard-hf-cache
    advancedMounts:
      llm-guard:
        llm-guard:
          - path: /app/.cache/huggingface
  llm-tool-guard-hf-home:
    type: emptyDir
    advancedMounts:
      llm-tool-guard:
        llm-tool-guard:
          - path: /app/.cache/huggingface
  # Hub-cache layout; revision pinned in container-images llm-tool-guard-model
  llm-tool-guard-model:
    type: image
    image:
      repository: ghcr.io/anthony-spruyt/llm-tool-guard-model
      tag: 1.0.1@sha256:18d31f9765e9111ff1a0bd69056d27c46d24643e696a797cb367f45b2672a2af
    pullPolicy: IfNotPresent
    advancedMounts:
      llm-tool-guard:
        llm-tool-guard:
          - path: /app/.cache/huggingface/hub
            readOnly: true
  litellm-middleware:
    type: image
    image:
      repository: ghcr.io/anthony-spruyt/litellm-middleware
      tag: 1.5.0@sha256:3384eafe28da0da91ebd17200f7de87721af6d27a8e1a18098c0f86949778914
    pullPolicy: IfNotPresent
    advancedMounts:
      litellm:
        litellm:
          - path: /opt/litellm-middleware
            readOnly: true
