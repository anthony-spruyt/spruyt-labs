---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: standard
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: "OnRootMismatch"
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

controllers:
  litellm:
    type: deployment
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: litellm
              topologyKey: kubernetes.io/hostname
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      litellm:
        image:
          repository: ghcr.io/berriai/litellm-non_root
          # renovate: datasource=custom.litellm-middleware-tested depName=ghcr.io/berriai/litellm-non_root
          tag: "v1.104.2@sha256:e8dee87e7ddbf9abc174e8a7b180a690d5265cc4827458d22c5ff5e108170027"
          pullPolicy: IfNotPresent
        args:
          - "--config"
          - "/app/config.yaml"
          - "--port"
          - "4000"
        env:
          AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
          DATABASE_URL:
            value: "postgresql://litellm:$(LITELLM_DB_PASSWORD)@litellm-cnpg-cluster-rw.litellm:5432/litellm"
            dependsOn: LITELLM_DB_PASSWORD
          GENERIC_AUTHORIZATION_ENDPOINT: "https://auth.${EXTERNAL_DOMAIN}/application/o/authorize/"
          GENERIC_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: litellm-oauth-credentials
                key: GENERIC_CLIENT_ID
          GENERIC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: litellm-oauth-credentials
                key: GENERIC_CLIENT_SECRET
          GENERIC_SCOPE: "openid profile email litellm_role"
          GENERIC_TOKEN_ENDPOINT: "https://auth.${EXTERNAL_DOMAIN}/application/o/token/"
          GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
          GENERIC_USERINFO_ENDPOINT: "https://auth.${EXTERNAL_DOMAIN}/application/o/userinfo/"
          LITELLM_DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: litellm-cnpg-owner
                key: password
          LITELLM_DISABLE_ACCESS_LOG_PATHS: "/health/liveliness,/health/readiness,/metrics,/metrics/"
          # OTLP metrics stay off: the integration derives the metrics endpoint
          # from OTEL_ENDPOINT by swapping the trailing signal path, so metrics
          # would be POSTed to VictoriaTraces (traces-only, returns 400).
          # Metrics reach VictoriaMetrics via the prometheus callback + VMServiceScrape.
          LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "false"
          LITELLM_OTEL_V2: "true"
          OTEL_EXPORTER: otlp_http
          OTEL_ENDPOINT: http://victoria-traces-single-vt-single-server.observability.svc:10428/insert/opentelemetry/v1/traces
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "span_and_event"
          PRESIDIO_ANALYZER_API_BASE: "http://litellm-presidio-analyzer.litellm.svc.cluster.local:3000"
          PRESIDIO_ANONYMIZER_API_BASE: "http://litellm-presidio-anonymizer.litellm.svc.cluster.local:3000"
          PROXY_BASE_URL: "https://litellm.${EXTERNAL_DOMAIN}"
          PYTHONPATH: "/app:/opt/litellm-middleware"
          REDIS_HOST: litellm-valkey.litellm.svc
          REDIS_PORT: "6379"
          REDIS_USERNAME: litellm
          REDIS_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: litellm-valkey-users
                key: litellm
        envFrom:
          - secretRef:
              name: litellm-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health/liveliness
                port: 4000
              initialDelaySeconds: 120
              periodSeconds: 15
              failureThreshold: 3
              timeoutSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health/readiness
                port: 4000
              initialDelaySeconds: 120
              periodSeconds: 15
              failureThreshold: 3
              timeoutSeconds: 10
        resources:
          limits:
            memory: 3072Mi
          requests:
            cpu: 100m
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
  presidio-analyzer:
    type: deployment
    # Parked: guardrail unused (false positives); see Guardrails in README.md
    replicas: 0
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      presidio-analyzer:
        image:
          repository: mcr.microsoft.com/presidio-analyzer
          tag: "2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9"
          pullPolicy: IfNotPresent
        env:
          PRESIDIO_DEVICE: cpu
          RECOGNIZER_REGISTRY_CONF_FILE: /opt/presidio/conf/recognizers.yaml
        probes:
          startup:    # NLP model loading takes 60-120s
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 18    # 180s window
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 1Gi
          limits:
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
  presidio-anonymizer:
    type: deployment
    # Parked: guardrail unused (false positives); see Guardrails in README.md
    replicas: 0
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      presidio-anonymizer:
        image:
          repository: mcr.microsoft.com/presidio-anonymizer
          tag: "2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483"
          pullPolicy: IfNotPresent
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 6     # 30s window
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
  llm-guard:
    type: deployment
    # Parked: guardrail unused (false positives); see Guardrails in README.md
    replicas: 0
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      llm-guard:
        image:
          repository: ghcr.io/anthony-spruyt/llm-guard
          tag: "1.0.46@sha256:89279d694340e2d2d635bf623eefaedbe59d2fae9de899bd1493cd638555996b"
          pullPolicy: IfNotPresent
        env:
          LISTEN_PORT: "8000"
          # Per-scanner thresholds live in scanners.yml, not the THRESHOLD env.
          CONFIG_FILE: "/config/scanners.yml"
          # Resolve the model entirely from the HF_HOME cache PVC. Without this
          # a warm start still makes metadata revalidation calls to the Hub, so
          # a hung huggingface.co could stall readiness even though every byte
          # of the model is already on local storage.
          #
          # Deliberately fail-closed: a pod starting against an EMPTY cache
          # cannot populate it and will never become ready. If the cache PVC is
          # ever lost, drop this var, let one pod repopulate, then restore it.
          # Ref #2592
          HF_HUB_OFFLINE: "1"
          HF_TOKEN:
            valueFrom:
              secretKeyRef:
                name: litellm-secrets
                key: HF_TOKEN
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8000
              periodSeconds: 10
              timeoutSeconds: 5
              # 300s window sized for the cold case: the first pod to run after
              # the HF cache PVC is empty pulls the rogue-security model over
              # egress before loading it. Warm starts read from the PVC instead.
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8000
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

service:
  litellm:
    controller: litellm
    ports:
      http:
        port: 4000
        protocol: TCP
  presidio-analyzer:
    controller: presidio-analyzer
    ports:
      http:
        port: 3000
        protocol: TCP
  presidio-anonymizer:
    controller: presidio-anonymizer
    ports:
      http:
        port: 3000
        protocol: TCP
  llm-guard:
    controller: llm-guard
    ports:
      http:
        port: 8000
        protocol: TCP

configMaps:
  presidio-recognizers:
    data:
      recognizers.yaml: |
        supported_languages:
          - en
        global_regex_flags: 26
        recognizers:
          - name: CreditCardRecognizer
            supported_languages:
              - language: en
                context: [credit, card, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
            type: predefined
          - name: AuAbnRecognizer
            supported_languages:
              - en
            type: predefined
          - name: AuAcnRecognizer
            supported_languages:
              - en
            type: predefined
          - name: AuTfnRecognizer
            supported_languages:
              - en
            type: predefined
          - name: AuMedicareRecognizer
            supported_languages:
              - en
            type: predefined
          - name: CryptoRecognizer
            type: predefined
          - name: DateRecognizer
            type: predefined
          - name: IbanRecognizer
            type: predefined
          - name: IpRecognizer
            type: predefined
          - name: MedicalLicenseRecognizer
            type: predefined
  llm-guard-scanners:
    data:
      scanners.yml: |
        input_scanners:
          - type: PromptInjection
            params:
              model: rogue-security/prompt-injection-jailbreak-sentinel-v2
              injection_label: jailbreak
              threshold: 0.97
              match_type: full
              model_max_length: 512
          - type: Regex
            params:
              patterns: ["Bearer [A-Za-z0-9-._~+/]+"]
              is_blocked: true
              match_type: search
              redact: true
          - type: InvisibleText
            params: {}
  litellm-config:
    data:
      config.yaml: |
        general_settings:
          always_include_stream_usage: true
          disable_env_credential_login: true
          forward_client_headers_to_llm_api: true
          include_call_id_in_error_body: true
          mcp_trusted_proxy_ranges:
            - "${CLUSTER_POD_CIDR_IP4}"
          store_model_in_db: true
          supported_db_objects:
            - mcp
          trusted_proxy_ranges:
            - "${CLUSTER_POD_CIDR_IP4}"
          use_redis_transaction_buffer: true
          use_x_forwarded_for: true
          user_api_key_cache_ttl: 300
        guardrails:
          - guardrail_name: pii-protection
            litellm_params:
              guardrail: presidio
              mode: pre_call
              default_on: false
              skip_system_message_in_guardrail: true
              presidio_filter_scope: input
              presidio_score_thresholds:
                ALL: 0.7
                PERSON: 0.85
                AU_TFN: 0.4
                AU_MEDICARE: 0.4
                AU_ABN: 0.4
                AU_ACN: 0.4
              pii_entities_config:
                CREDIT_CARD: MASK
                AU_TFN: MASK
                AU_MEDICARE: MASK
                AU_ABN: MASK
                AU_ACN: MASK
                IBAN_CODE: MASK
          - guardrail_name: prompt-injection
            litellm_params:
              guardrail: generic_guardrail_api
              mode: pre_call
              default_on: false
              skip_system_message_in_guardrail: true
              api_base: http://litellm-llm-guard.litellm.svc.cluster.local:8000
          # Sends tool outputs to TypeSafe (external) - keep opt-in
          - guardrail_name: jev-compaction
            litellm_params:
              guardrail: typesafe
              mode: pre_call
              default_on: false
              api_key: os.environ/TYPESAFE_API_KEY
              unreachable_fallback: fail_open
              optional_params:
                relevance_threshold: 0.2
        litellm_settings:
          cache: true
          cache_params:
            type: redis
            ttl: 3600
          callbacks:
            - otel
            - prometheus
            - websearch_interception
            - litellm_middleware.pipeline_plugin.pipeline_middleware
          drop_params: true
          websearch_interception_params:
            enabled_providers:
              - anthropic
              - hosted_vllm
              - openai
            search_tool_name: brave-search
        model_list:
          # --------------------------------------------------------------------------
          # Openrouter: PAYG
          # --------------------------------------------------------------------------
          - model_name: "openrouter/free"
            litellm_params:
              model: "openrouter/free"
              api_key: os.environ/OPENROUTER_API_KEY
              input_cost_per_token: 0.0
              output_cost_per_token: 0.0
          - model_name: "openrouter/x-ai/grok-4.6"
            litellm_params:
              model: "openrouter/x-ai/grok-4.6"
              api_key: os.environ/OPENROUTER_API_KEY
              input_cost_per_token: 0.000002
              output_cost_per_token: 0.000006
          # --------------------------------------------------------------------------
          # Anthropic: Subscription
          # --------------------------------------------------------------------------
          # stream_timeout is the per-read idle limit - a stalled upstream otherwise holds the stream 600s
          - model_name: "anthropic/claude-fable-5"
            litellm_params:
              model: "anthropic/claude-fable-5"
              stream_timeout: 120
          - model_name: "anthropic/claude-fable-5-1"
            litellm_params:
              model: "anthropic/claude-fable-5-1"
              stream_timeout: 120
          - model_name: "anthropic/claude-opus-5-5"
            litellm_params:
              model: "anthropic/claude-opus-5-5"
              stream_timeout: 120
          - model_name: "anthropic/claude-sonnet-5-5"
            litellm_params:
              model: "anthropic/claude-sonnet-5-5"
              stream_timeout: 120
          # Catch-alls for Opus/Sonnet names clients can't change - only reached when no alias or exact name matches
          - model_name: "*claude*opus*"
            litellm_params:
              model: "anthropic/claude-opus-5-5"
              stream_timeout: 120
          - model_name: "*claude*sonnet*"
            litellm_params:
              model: "anthropic/claude-sonnet-5-5"
              stream_timeout: 120
          - model_name: "anthropic/claude-haiku-4-5"
            litellm_params:
              model: "anthropic/claude-haiku-4-5"
              stream_timeout: 120
          # --------------------------------------------------------------------------
          # OpenAI: PAYG
          # --------------------------------------------------------------------------
          - model_name: "openai/gpt-4o-mini"
            litellm_params:
              model: "openai/gpt-4o-mini"
              api_key: os.environ/OPENAI_API_KEY
          - model_name: "openai/text-embedding-3-small"
            litellm_params:
              model: "text-embedding-3-small"
              api_key: os.environ/OPENAI_API_KEY
          # --------------------------------------------------------------------------
          # Auto router: TypeSafe Jev classifier
          # --------------------------------------------------------------------------
          - model_name: "jev-router"
            litellm_params:
              model: "auto_router/complexity_router"
              complexity_router_default_model: "anthropic/claude-sonnet-5-5"
              complexity_router_config:
                tiers:
                  # Not Haiku 4.5 - Claude Code sends Claude 5 features to unknown models and Haiku 400s
                  SIMPLE: "anthropic/claude-sonnet-5-5"
                  MEDIUM: "anthropic/claude-sonnet-5-5"
                  COMPLEX: "anthropic/claude-opus-5-5"
                  REASONING: "anthropic/claude-fable-5-1"
                classifier_type: jev
                jev_classifier_config:
                  model: jev-latest
                  timeout_ms: 3000
                # Replays the held tier on tool-result turns - no mid-loop model switches
                classification_mode: user_turn
        router_settings:
          enable_weighted_failover: true
          model_group_alias:
            "claude-haiku-4-5": "anthropic/claude-haiku-4-5"
            "claude-haiku-4-5-20251001": "anthropic/claude-haiku-4-5"
            "claude-sonnet-5": "anthropic/claude-sonnet-5-5"
            "anthropic/claude-sonnet-5": "anthropic/claude-sonnet-5-5"
            "claude-sonnet-5-5": "anthropic/claude-sonnet-5-5"
            "claude-opus-5": "anthropic/claude-opus-5-5"
            "anthropic/claude-opus-5": "anthropic/claude-opus-5-5"
            "claude-opus-5-5": "anthropic/claude-opus-5-5"
            "claude-fable-5": "anthropic/claude-fable-5"
            "claude-fable-5-1": "anthropic/claude-fable-5-1"
          redis_host: litellm-valkey.litellm.svc
          redis_port: "6379"
          redis_password: os.environ/REDIS_PASSWORD
          routing_strategy: simple-shuffle
        search_tools:
          - search_tool_name: brave-search
            litellm_params:
              search_provider: brave
              api_key: os.environ/BRAVE_API_KEY
          - search_tool_name: firecrawl-search
            litellm_params:
              search_provider: firecrawl
              api_key: os.environ/FIRECRAWL_API_KEY

persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  config:
    type: configMap
    identifier: litellm-config
    advancedMounts:
      litellm:
        litellm:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
  presidio-recognizers-config:
    type: configMap
    identifier: presidio-recognizers
    advancedMounts:
      presidio-analyzer:
        presidio-analyzer:
          - path: /opt/presidio/conf/recognizers.yaml
            subPath: recognizers.yaml
            readOnly: true
  presidio-analyzer-cache:
    type: emptyDir
    advancedMounts:
      presidio-analyzer:
        presidio-analyzer:
          - path: /home/presidio/.cache
  presidio-anonymizer-cache:
    type: emptyDir
    advancedMounts:
      presidio-anonymizer:
        presidio-anonymizer:
          - path: /home/presidio/.cache
  llm-guard-scanners-config:
    type: configMap
    identifier: llm-guard-scanners
    advancedMounts:
      llm-guard:
        llm-guard:
          - path: /config/scanners.yml
            subPath: scanners.yml
            readOnly: true
  # HF_HOME for llm-guard. Weights are pulled from the Hub on first load and
  # reused from here afterwards, so restarts skip the download.
  llm-guard-hf-cache:
    type: persistentVolumeClaim
    existingClaim: llm-guard-hf-cache
    advancedMounts:
      llm-guard:
        llm-guard:
          - path: /app/.cache/huggingface
  litellm-middleware:
    type: image
    image:
      repository: ghcr.io/anthony-spruyt/litellm-middleware
      tag: 1.0.1@sha256:192e72959213d3ba5ec2e88d8a1c77c97de6b3519f4ce43e0e37ea76543d4f7a
    pullPolicy: IfNotPresent
    advancedMounts:
      litellm:
        litellm:
          - path: /opt/litellm-middleware
            readOnly: true
