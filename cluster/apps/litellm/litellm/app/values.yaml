---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: standard
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: "OnRootMismatch"
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

controllers:
  litellm:
    type: deployment
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: litellm
              topologyKey: kubernetes.io/hostname
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      litellm:
        image:
          repository: ghcr.io/berriai/litellm-non_root
          # renovate: datasource=custom.litellm-middleware-tested depName=ghcr.io/berriai/litellm-non_root
          tag: "v1.105.0@sha256:763ad5871b2747fba2c4872b504ac43ca452a6fbf49fb2b0345a42abacf6f91a"
          pullPolicy: IfNotPresent
        args:
          - "--config"
          - "/app/config.yaml"
          - "--port"
          - "4000"
        env:
          AUTO_REDIRECT_UI_LOGIN_TO_SSO: "true"
          BRAVE_API_KEY:
            valueFrom:
              secretKeyRef:
                name: litellm-brave
                key: BRAVE_API_KEY
          DATABASE_URL:
            value: "postgresql://litellm:$(LITELLM_DB_PASSWORD)@litellm-cnpg-cluster-rw.litellm:5432/litellm"
            dependsOn: LITELLM_DB_PASSWORD
          GENERIC_AUTHORIZATION_ENDPOINT: "https://auth.${EXTERNAL_DOMAIN}/application/o/authorize/"
          GENERIC_CLIENT_ID:
            valueFrom:
              secretKeyRef:
                name: litellm-oauth-credentials
                key: GENERIC_CLIENT_ID
          GENERIC_CLIENT_SECRET:
            valueFrom:
              secretKeyRef:
                name: litellm-oauth-credentials
                key: GENERIC_CLIENT_SECRET
          GENERIC_SCOPE: "openid profile email litellm_role"
          GENERIC_TOKEN_ENDPOINT: "https://auth.${EXTERNAL_DOMAIN}/application/o/token/"
          GENERIC_USER_ROLE_ATTRIBUTE: litellm_role
          GENERIC_USERINFO_ENDPOINT: "https://auth.${EXTERNAL_DOMAIN}/application/o/userinfo/"
          LITELLM_DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: litellm-cnpg-owner
                key: password
          LITELLM_DISABLE_ACCESS_LOG_PATHS: "/health/liveliness,/health/readiness,/metrics,/metrics/"
          # OTLP metrics stay off: the integration derives the metrics endpoint
          # from OTEL_ENDPOINT by swapping the trailing signal path, so metrics
          # would be POSTed to VictoriaTraces (traces-only, returns 400).
          # Metrics reach VictoriaMetrics via the prometheus callback + VMServiceScrape.
          LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "false"
          LITELLM_OTEL_V2: "true"
          OTEL_EXPORTER: otlp_http
          OTEL_ENDPOINT: http://victoria-traces-single-vt-single-server.observability.svc:10428/insert/opentelemetry/v1/traces
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "span_and_event"
          PRESIDIO_ANALYZER_API_BASE: "http://litellm-presidio-analyzer.litellm.svc.cluster.local:3000"
          PRESIDIO_ANONYMIZER_API_BASE: "http://litellm-presidio-anonymizer.litellm.svc.cluster.local:3000"
          PROXY_BASE_URL: "https://litellm.${EXTERNAL_DOMAIN}"
          PYTHONPATH: "/app:/opt/litellm-middleware"
          REDIS_HOST: litellm-valkey.litellm.svc
          REDIS_PORT: "6379"
          REDIS_USERNAME: litellm
          REDIS_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: litellm-valkey-users
                key: litellm
          TOOL_GUARD_TIMEOUT_SECONDS: "180"
          TOOL_GUARD_URL: "http://litellm-llm-tool-guard.litellm.svc.cluster.local:8080"
        envFrom:
          - secretRef:
              name: litellm-secrets
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health/liveliness
                port: 4000
              initialDelaySeconds: 120
              periodSeconds: 15
              failureThreshold: 3
              timeoutSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health/readiness
                port: 4000
              initialDelaySeconds: 120
              periodSeconds: 15
              failureThreshold: 3
              timeoutSeconds: 10
        resources:
          limits:
            memory: 3072Mi
          requests:
            cpu: 100m
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
  presidio-analyzer:
    type: deployment
    # Parked: guardrail unused (false positives); see Guardrails in README.md
    replicas: 0
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      presidio-analyzer:
        image:
          repository: mcr.microsoft.com/presidio-analyzer
          tag: "2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9"
          pullPolicy: IfNotPresent
        env:
          PRESIDIO_DEVICE: cpu
          RECOGNIZER_REGISTRY_CONF_FILE: /opt/presidio/conf/recognizers.yaml
          # No egress: fail the Public Suffix List fetch fast and use the bundled snapshot
          TLDEXTRACT_CACHE_TIMEOUT: "2"
        probes:
          startup:    # NLP model loading takes 60-120s
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 18    # 180s window
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 1Gi
          limits:
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
  presidio-anonymizer:
    type: deployment
    # Parked: guardrail unused (false positives); see Guardrails in README.md
    replicas: 0
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      presidio-anonymizer:
        image:
          repository: mcr.microsoft.com/presidio-anonymizer
          tag: "2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483"
          pullPolicy: IfNotPresent
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 6     # 30s window
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 3000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
  llm-guard:
    type: deployment
    # Parked: guardrail unused (false positives); see Guardrails in README.md
    replicas: 0
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      llm-guard:
        image:
          repository: ghcr.io/anthony-spruyt/llm-guard
          tag: "1.1.3@sha256:cd3e03f7cac45b87c86665b6c833e488e3f585e062b572b85c1722df8509ff8b"
          pullPolicy: IfNotPresent
        env:
          LISTEN_PORT: "8000"
          # Per-scanner thresholds live in scanners.yml, not the THRESHOLD env.
          CONFIG_FILE: "/config/scanners.yml"
          # Load the model from the HF cache PVC only; remove to refill an empty cache (see README)
          HF_HUB_OFFLINE: "1"
          HF_TOKEN:
            valueFrom:
              secretKeyRef:
                name: litellm-secrets
                key: HF_TOKEN
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8000
              periodSeconds: 10
              timeoutSeconds: 5
              # 300s window covers the cold case: a pod with an empty HF cache PVC downloads the model first
              failureThreshold: 30
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8000
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8000
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 1Gi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
  llm-tool-guard:
    type: deployment
    replicas: 2
    strategy: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      # Longest scan ~45 s + 20 s drain on SIGTERM + preStop sleep, with margin.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/controller: llm-tool-guard
                    app.kubernetes.io/instance: litellm
                # Count only same-revision pods, else a rollout stacks both new pods on the node free of old ones
                matchLabelKeys:
                  - pod-template-hash
                topologyKey: kubernetes.io/hostname
    containers:
      llm-tool-guard:
        image:
          repository: ghcr.io/anthony-spruyt/llm-tool-guard
          tag: "1.3.0@sha256:2429cada060b4adde48689d74b89dad9091d25556e0056dd29e0ea4182deb719"
          pullPolicy: IfNotPresent
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        env:
          HF_HUB_OFFLINE: "1"
          VALKEY_URL: "redis://litellm-valkey.litellm.svc:6379"
          VALKEY_USERNAME: llm-tool-guard
          VALKEY_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: litellm-valkey-users
                key: llm-tool-guard
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 5
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3
        resources:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 3Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL

service:
  litellm:
    controller: litellm
    ports:
      http:
        port: 4000
        protocol: TCP
  presidio-analyzer:
    controller: presidio-analyzer
    ports:
      http:
        port: 3000
        protocol: TCP
  presidio-anonymizer:
    controller: presidio-anonymizer
    ports:
      http:
        port: 3000
        protocol: TCP
  llm-guard:
    controller: llm-guard
    ports:
      http:
        port: 8000
        protocol: TCP
  llm-tool-guard:
    controller: llm-tool-guard
    ports:
      http:
        port: 8080
        protocol: TCP

configMaps:
  presidio-recognizers:
    data:
      recognizers.yaml: |
        supported_languages:
          - en
        global_regex_flags: 26
        recognizers:
          - name: CreditCardRecognizer
            supported_languages:
              - language: en
                context: [credit, card, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
            type: predefined
          - name: AuAbnRecognizer
            supported_languages:
              - en
            type: predefined
          - name: AuAcnRecognizer
            supported_languages:
              - en
            type: predefined
          - name: AuTfnRecognizer
            supported_languages:
              - en
            type: predefined
          - name: AuMedicareRecognizer
            supported_languages:
              - en
            type: predefined
          - name: CryptoRecognizer
            type: predefined
          - name: DateRecognizer
            type: predefined
          - name: IbanRecognizer
            type: predefined
          - name: IpRecognizer
            type: predefined
          - name: MedicalLicenseRecognizer
            type: predefined
  llm-guard-scanners:
    data:
      scanners.yml: |
        input_scanners:
          - type: PromptInjection
            params:
              model: Horizon-Labs/prompt-injection-guard-base
              injection_label: INJECTION
              threshold: 0.9
              match_type: sliding_window
              model_max_length: 2048
              window_overlap: 512
              window_batch_size: 1
              max_windows: 136
          - type: Regex
            params:
              patterns: ["Bearer [A-Za-z0-9-._~+/]+"]
              is_blocked: true
              match_type: search
              redact: true
          - type: InvisibleText
            params: {}
  litellm-config:
    data:
      config.yaml: |
        general_settings:
          always_include_stream_usage: true
          disable_env_credential_login: true
          enforce_fallback_model_access: true
          forward_client_headers_to_llm_api: true
          include_call_id_in_error_body: true
          mcp_trusted_proxy_ranges:
            - "${CLUSTER_POD_CIDR_IP4}"
          # Pinned: keys get MCP access only by inheriting their team's grants
          require_key_mcp_access_defined: false
          store_model_in_db: true
          store_prompts_in_spend_logs: true
          supported_db_objects:
            - mcp
          trusted_proxy_ranges:
            - "${CLUSTER_POD_CIDR_IP4}"
          use_redis_transaction_buffer: true
          use_x_forwarded_for: true
          user_api_key_cache_ttl: 300
        guardrails:
          - guardrail_name: pii-protection
            litellm_params:
              guardrail: presidio
              mode: pre_call
              default_on: false
              skip_system_message_in_guardrail: true
              presidio_filter_scope: input
              presidio_score_thresholds:
                ALL: 0.7
                PERSON: 0.85
                AU_TFN: 0.4
                AU_MEDICARE: 0.4
                AU_ABN: 0.4
                AU_ACN: 0.4
              pii_entities_config:
                CREDIT_CARD: MASK
                AU_TFN: MASK
                AU_MEDICARE: MASK
                AU_ABN: MASK
                AU_ACN: MASK
                IBAN_CODE: MASK
          - guardrail_name: prompt-injection
            litellm_params:
              guardrail: generic_guardrail_api
              mode: pre_call
              default_on: false
              skip_system_message_in_guardrail: true
              api_base: http://litellm-llm-guard.litellm.svc.cluster.local:8000
          - guardrail_name: tool-guard
            litellm_params:
              guardrail: litellm_middleware.tool_guard.placeholder.ToolGuardPlaceholder
              mode: pre_call
              default_on: false
          # Sends tool outputs to TypeSafe (external) - keep opt-in
          - guardrail_name: jev-compaction
            litellm_params:
              guardrail: typesafe
              mode: pre_call
              default_on: false
              api_key: os.environ/TYPESAFE_API_KEY
              unreachable_fallback: fail_open
              optional_params:
                relevance_threshold: 0.2
        litellm_settings:
          cache: true
          cache_params:
            type: redis
            ttl: 3600
          callbacks:
            - otel
            - prometheus
            - websearch_interception
            - litellm_middleware.pipeline_plugin.pipeline_middleware
          drop_params: true
          websearch_interception_params:
            enabled_providers:
              - anthropic
              - hosted_vllm
              - openai
            search_tool_name: brave-search
        # Only allowed_tools gates calls; disallowed_tools records tools reviewed and skipped (README "MCP tool drift")
        mcp_servers:
          bravesearch:
            server_id: 68db2756-13cb-4cf0-a172-666438cd28c4
            alias: bravesearch
            description: "An MCP server implementation that integrates the Brave Search API, providing comprehensive search capabilities including web search, local business search, place search, image search, video search, news search, LLM context, and AI-powered summarization. This project supports both STDIO and HTTP transports, with STDIO as the default mode."
            url: http://brave-search-mcp.brave-search-mcp.svc:8000/mcp
            transport: http
            auth_type: none
            allowed_tools:
              - brave_web_search
            disallowed_tools:
              - brave_image_search
              - brave_llm_context
              - brave_local_search
              - brave_news_search
              - brave_place_search
              - brave_summarizer
              - brave_video_search
            allow_all_keys: false
            available_on_public_internet: false
          cloudflare:
            server_id: a59f88c6-6525-432e-b285-01e0faf4966c
            alias: cloudflare
            description: "Manage Cloudflare Workers, KV, R2, D1, and more"
            url: https://mcp.cloudflare.com/mcp
            transport: http
            auth_type: bearer_token
            authentication_token: os.environ/MCP_CLOUDFLARE_TOKEN
            allowed_tools:
              - search
              - execute
            disallowed_tools:
              - docs
              - whoami
            allow_all_keys: false
            available_on_public_internet: false
          context7:
            server_id: 6a477489-a343-4aef-83bb-c6afb4c0b4c5
            alias: context7
            description: "Context7 brings up-to-date, version-specific documentation and code examples directly into your AI coding assistant. That means no more outdated code or hallucinated APIs."
            url: https://mcp.context7.com/mcp
            transport: http
            auth_type: bearer_token
            authentication_token: os.environ/MCP_CONTEXT7_TOKEN
            allowed_tools:
              - resolve-library-id
              - query-docs
            allow_all_keys: false
            available_on_public_internet: false
          github:
            server_id: 0f2767c6-8c8e-4c78-a5f3-7e11f709228d
            alias: github
            description: "Manage repos, issues, PRs, and workflows through natural language"
            url: https://api.githubcopilot.com/mcp/
            transport: http
            auth_type: bearer_token
            authentication_token: os.environ/MCP_GITHUB_TOKEN
            allowed_tools:
              - add_comment_to_pending_review
              - add_issue_comment
              - add_reply_to_pull_request_comment
              - create_branch
              - create_or_update_file
              - create_pull_request
              - create_repository
              - delete_file
              - fork_repository
              - get_commit
              - get_file_contents
              - get_label
              - get_latest_release
              - get_me
              - get_release_by_tag
              - get_tag
              - get_team_members
              - get_teams
              - issue_read
              - issue_write
              - list_branches
              - list_commits
              - list_issue_types
              - list_issues
              - list_pull_requests
              - list_releases
              - list_repository_collaborators
              - list_tags
              - merge_pull_request
              - pull_request_read
              - pull_request_review_write
              - push_files
              - request_copilot_review
              - run_secret_scanning
              - search_code
              - search_commits
              - search_issues
              - search_pull_requests
              - search_repositories
              - search_users
              - sub_issue_write
              - update_pull_request
              - update_pull_request_branch
            disallowed_tools:
              - list_issue_fields
              - ui_get
              - update_issue_comment
            allow_all_keys: false
            available_on_public_internet: false
          homeassistant:
            server_id: 7d9f00a2-cc7f-479c-bb58-5976bf57518b
            alias: homeassistant
            url: http://${HOME_ASSISTANT_IP4}:8123/api/mcp
            transport: http
            auth_type: bearer_token
            authentication_token: os.environ/MCP_HOMEASSISTANT_TOKEN
            allowed_tools:
              - assist_satellite__HassBroadcast
              - climate__HassClimateSetTemperature
              - homeassistant__GetLiveContext
              - intent__HassTurnOn
              - intent__HassTurnOff
              - intent__HassSetPosition
              - intent__HassStopMoving
              - intent__HassCancelAllTimers
              - light__HassLightSet
              - llm__GetDateTime
              - media_player__HassMediaUnpause
              - media_player__HassMediaPause
              - media_player__HassMediaNext
              - media_player__HassMediaPrevious
              - media_player__HassSetVolume
              - media_player__HassSetVolumeRelative
              - media_player__HassMediaPlayerMute
              - media_player__HassMediaPlayerUnmute
              - script__alexa_speak
              - script__reboot_chromance
              - calendar__get_events
            allow_all_keys: false
            available_on_public_internet: false
          microsoft_learn:
            server_id: c48a701f-dae1-4225-a899-91839efc0eb2
            alias: microsoft_learn
            description: "https://learn.microsoft.com/en-us/training/support/mcp"
            url: https://learn.microsoft.com/api/mcp
            transport: http
            auth_type: none
            allowed_tools:
              - microsoft_docs_search
              - microsoft_code_sample_search
              - microsoft_docs_fetch
            allow_all_keys: false
            available_on_public_internet: false
          postgres:
            server_id: a9b58b0c-4242-42ab-b223-90e155f6d199
            alias: postgres
            description: "Read-only SQL on cluster Postgres databases"
            url: http://db-mcp.db-mcp.svc:8080/mcp
            transport: http
            auth_type: none
            allowed_tools:
              - execute_sql_temporal
              - search_objects_temporal
              - execute_sql_temporal_visibility
              - search_objects_temporal_visibility
              - execute_sql_agent_platform
              - search_objects_agent_platform
            allow_all_keys: false
            available_on_public_internet: false
          sonar:
            server_id: 71147f4d-3a8a-46ec-9728-87e0268fecfd
            alias: sonar
            description: "The SonarQube MCP Server is a Model Context Protocol (MCP) server that connects your AI coding agent to SonarQube's code quality and security data."
            url: https://api.sonarcloud.io/mcp
            transport: http
            auth_type: bearer_token
