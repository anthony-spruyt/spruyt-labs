---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/persistentvolumeclaim.json
# HF_HOME cache for llm-guard; delete reclaim, refill by unsetting HF_HUB_OFFLINE (see README)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-guard-hf-cache
  namespace: litellm
spec:
  storageClassName: rbd-fast-delete
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
