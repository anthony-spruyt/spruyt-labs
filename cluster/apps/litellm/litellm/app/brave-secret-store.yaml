---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: brave-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: brave-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: brave-search-mcp
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: brave-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-brave
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: brave-secret-store
  target:
    name: litellm-brave
    creationPolicy: Owner
  data:
    - secretKey: BRAVE_API_KEY
      remoteRef:
        key: brave-search-secrets
        property: BRAVE_API_KEY
