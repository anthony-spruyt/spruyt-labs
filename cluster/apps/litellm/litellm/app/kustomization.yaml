---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./aws-secret-store.yaml
  - ./aws-external-secret.yaml
  - ./authentik-secret-store.yaml
  - ./litellm-oauth-external-secret.yaml
  - ./litellm-secrets.sops.yaml
  - ./litellm-cnpg-object-stores.yaml
  - ./cnpg-roles-eso.yaml
  - ./litellm-cnpg-cluster.yaml
  - ./litellm-cnpg-scheduled-backups.yaml
  - ./network-policies.yaml
  - ./oauth-rotation-rbac.yaml
  - ./persistent-volume-claims.yaml
  - ./release.yaml
  - ./vm-service-scrape.yaml
  - ./vpa.yaml
configMapGenerator:
  - name: litellm-values
    namespace: litellm
    files:
      - values.yaml
  - name: litellm-middleware-plugin
    namespace: litellm
    options:
      disableNameSuffixHash: true
    files:
      - __init__.py=plugins/middleware/__init__.py
      - base.py=plugins/middleware/base.py
      - pipeline.py=plugins/middleware/pipeline.py
      - pipeline_plugin.py=plugins/middleware/pipeline_plugin.py
      - registry.py=plugins/middleware/registry.py
      - chatgpt.py=plugins/middleware/chatgpt/chatgpt.py
      - litellm_patch.py=plugins/middleware/chatgpt/litellm_patch.py
      - mcp_tool_routing.py=plugins/middleware/mcp_tool_routing/mcp_tool_routing.py
      - ratelimit_headers.py=plugins/middleware/ratelimit_headers/ratelimit_headers.py
      - secret_masking.py=plugins/middleware/secret_masking/secret_masking.py
      - shared_fakes.py=plugins/middleware/secret_masking/shared_fakes.py
configurations:
  - ./kustomizeconfig.yaml
