---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./aws-secret-store.yaml
  - ./externalsecret-aws.yaml
  - ./authentik-secret-store.yaml
  - ./brave-secret-store.yaml
  - ./externalsecret-litellm-oauth.yaml
  - ./litellm-secrets.sops.yaml
  - ./llm-tool-guard-secrets.sops.yaml
  - ./litellm-cnpg-object-stores.yaml
  - ./cnpg-roles-eso.yaml
  - ./litellm-cnpg-cluster.yaml
  - ./litellm-cnpg-scheduled-backups.yaml
  - ./network-policies.yaml
  - ./oauth-rotation-rbac.yaml
  - ./pdb.yaml
  - ./release.yaml
  - ./vm-service-scrape.yaml
  - ./vmrule.yaml
  - ./vpa.yaml
configMapGenerator:
  - name: litellm-values
    namespace: litellm
    files:
      - values.yaml
configurations:
  - ./kustomizeconfig.yaml
