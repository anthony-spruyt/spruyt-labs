---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: litellm-llm-tool-guard
spec:
  groups:
    - name: litellm-llm-tool-guard
      rules:
        - alert: LLMToolGuardUnavailable
          expr: absent(llm_tool_guard_ready{namespace="litellm"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "llm-tool-guard is not ready"
            description: "No llm-tool-guard pod has reported a loaded model for 10 minutes."
        - alert: LLMToolGuardDegraded
          expr: sum(llm_tool_guard_ready{namespace="litellm"} == 1) < 2
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "llm-tool-guard has fewer than 2 ready pods"
            description: "Fewer than 2 llm-tool-guard pods have reported a loaded model for 15 minutes."
        - alert: LLMToolGuardJevFailing
          expr: |
            sum(increase(llm_tool_guard_jev_requests_total{namespace="litellm",outcome="error"}[6h])) > 0
            unless
            sum(increase(llm_tool_guard_jev_requests_total{namespace="litellm",outcome=~"blocked|cleared|middle"}[6h])) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "llm-tool-guard has had no Jev answer in 6 hours"
            description: "Jev questions failed in the last 6 hours and none were answered, so flagged tool output keeps the warning notice. Check the LiteLLM /v1/systemone route, the JEV_MODEL deployment in model_list and the llm-tool-guard virtual key."
