[project]
name = "litellm-middleware-plugin"
version = "0.1.0"
description = "LiteLLM proxy callback pipeline for composable middleware"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    # Runtime deps ship in the LiteLLM image; pinned here only so tests can import them.
    "cryptography>=44",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "chatgpt/tests",
    "hindsight/tests",
    "mcp_tool_routing/tests",
    "ratelimit_headers/tests",
    "secret_masking/tests",
]
