---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 4h
  # Two llm-tool-guard pods roll in turn, ~1.5GB cold each (~19m at the #2591 pull pace); shorter rolls the whole release back
  timeout: 30m
  valuesFrom:
    - kind: ConfigMap
      name: litellm-values
