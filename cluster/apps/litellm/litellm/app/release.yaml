---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 4h
  # Bounds pull AND readiness for every controller. The two llm-tool-guard pods roll in turn, ~1.5GB cold each: ~19m at
  # the 2.9GB-in-18m pull pace of #2591, and a shorter timeout rolls the whole release back. Ref #2591
  timeout: 30m
  valuesFrom:
    - kind: ConfigMap
      name: litellm-values
