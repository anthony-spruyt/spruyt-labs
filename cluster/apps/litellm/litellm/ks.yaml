---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: flux-system
spec:
  targetNamespace: litellm
  path: ./cluster/apps/litellm/litellm/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: authentik
    - name: cnpg-operator
    - name: external-secrets
    - name: plugin-barman-cloud
    - name: litellm-valkey
    - name: rook-ceph-cluster-storage
  prune: true
  # Matches the HelmRelease timeout. With wait: true this bounds health
  # checking, which includes the HelmRelease Ready condition — so leaving it at
  # 15m would fail the Kustomization on a slow image pull even after the Helm
  # upgrade itself succeeds, and traefik-ingress dependsOn this. Ref #2591
  timeout: 30m
  # Without this, a failed reconcile waits the full 4h interval before retrying.
  # Raising timeout to 30m pushes failure detection later, so worst-case recovery
  # from a transient overrun would be ~4.5h with traefik-ingress blocked behind
  # dependsOn for all of it. Ref #2591
  retryInterval: 5m
  wait: true
