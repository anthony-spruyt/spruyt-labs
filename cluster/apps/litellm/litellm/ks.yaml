---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: flux-system
spec:
  targetNamespace: litellm
  path: ./cluster/apps/litellm/litellm/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: authentik
    - name: cnpg-operator
    - name: external-secrets
    - name: plugin-barman-cloud
    - name: litellm-valkey
    - name: rook-ceph-cluster-storage
  prune: true
  # Must match the HelmRelease timeout: wait: true includes its Ready condition
  timeout: 30m
  # Without it a failed reconcile waits the full 4h interval, and traefik-ingress dependsOn this
  retryInterval: 5m
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-access-policy
  namespace: flux-system
spec:
  targetNamespace: litellm
  path: ./cluster/apps/litellm/litellm/access-policy
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: litellm
  prune: true
  retryInterval: 5m
  timeout: 10m
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-mcp-tool-drift
  namespace: flux-system
spec:
  targetNamespace: litellm
  path: ./cluster/apps/litellm/litellm/mcp-tool-drift
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: litellm
    - name: external-secrets
    - name: github-app-tokens
  prune: true
  retryInterval: 5m
  timeout: 10m
  wait: true
