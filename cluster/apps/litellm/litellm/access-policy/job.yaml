---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kubernetes/master/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-access-policy
  namespace: litellm
  annotations:
    # Flux deletes+recreates on spec change (Job fields are immutable).
    # Value MUST be "Enabled" per Flux docs — "true" is ignored.
    kustomize.toolkit.fluxcd.io/force: "Enabled"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-access-policy
    spec:
      restartPolicy: OnFailure
      priorityClassName: standard
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reconcile
          image: alpine/k8s:1.37.1@sha256:712dc5385d1c1a3f83b747fa9e40f64d433a97f72ff42f9755ff7dd1f62846e4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 30m, memory: 128Mi}
          env:
            - name: MODE
              value: enforce
            - name: LITELLM_URL
              value: "http://litellm.litellm.svc.cluster.local:4000"
            - name: LITELLM_MASTER_KEY
              valueFrom: {secretKeyRef: {name: litellm-secrets, key: LITELLM_MASTER_KEY}}
            - name: POLICY_FILE
              value: /policy/access-policy.yml
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["python3", "/scripts/reconcile.py"]
          volumeMounts:
            - {name: script, mountPath: /scripts, readOnly: true}
            - {name: policy, mountPath: /policy, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: script
          configMap:
            name: litellm-access-policy-script
        - name: policy
          configMap:
            name: litellm-access-policy
        - name: tmp
          emptyDir: {}
