---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Write-tier GitHub App token for gh in spruyt-labs workspaces
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-bot-credentials
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: github-secret-store
  target:
    name: github-bot-credentials
    creationPolicy: Owner
  data:
    - secretKey: hosts.yml
      remoteRef:
        key: github-bot-credentials
        property: write-hosts.yml
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# spruyt-labs-bot SSH key for git transport and commit signing in spruyt-labs workspaces
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-bot-ssh-key
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: github-secret-store
  target:
    name: github-bot-ssh-key
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: github-bot-ssh-key
        property: id_ed25519
    - secretKey: id_ed25519.pub
      remoteRef:
        key: github-bot-ssh-key
        property: id_ed25519.pub
