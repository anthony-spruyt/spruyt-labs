---
# Mirrors, not location rewrites: podman falls back to the upstream registry when Nexus fails.
# docker-group (8082) serves OCI v2 at host root and aggregates every upstream; plain HTTP in-cluster. Ref #976.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coder-workspace-registries-conf
  namespace: coder-workspaces
data:
  99-nexus-mirror.conf: |
    [[registry]]
    location = "docker.io"
    [[registry.mirror]]
    location = "nexus.nexus-system.svc.cluster.local:8082"
    insecure = true

    [[registry]]
    location = "ghcr.io"
    [[registry.mirror]]
    location = "nexus.nexus-system.svc.cluster.local:8082"
    insecure = true

    [[registry]]
    location = "quay.io"
    [[registry.mirror]]
    location = "nexus.nexus-system.svc.cluster.local:8082"
    insecure = true

    [[registry]]
    location = "mcr.microsoft.com"
    [[registry.mirror]]
    location = "nexus.nexus-system.svc.cluster.local:8082"
    insecure = true

    [[registry]]
    location = "registry.k8s.io"
    [[registry.mirror]]
    location = "nexus.nexus-system.svc.cluster.local:8082"
    insecure = true
