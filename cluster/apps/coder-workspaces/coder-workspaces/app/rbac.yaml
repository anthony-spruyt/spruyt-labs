---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workspace
  namespace: coder-workspaces
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coder-workspace-ops
  namespace: coder-workspaces
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coder-workspace-ops
# Never grant: secrets (any verb), RBAC/webhook/CRD/APIService/authn/authz writes, node or namespace delete.
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - limitranges
      - namespaces
      - nodes
      - persistentvolumeclaims
      - persistentvolumes
      - pods
      - replicationcontrollers
      - resourcequotas
      - serviceaccounts
      - services
    verbs: [get, list, watch]
  # When adding a new CRD operator, add its API group here for read access.
  - apiGroups:
      - acme.cert-manager.io
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - apps
      - authentication.k8s.io
      - authorization.k8s.io
      - autoscaling
      - autoscaling.k8s.io
      - barmancloud.cnpg.io
      - batch
      - ceph.rook.io
      - cert-manager.io
      - certificates.k8s.io
      - cilium.io
      - coordination.k8s.io
      - csi.ceph.io
      - csiaddons.openshift.io
      - discovery.k8s.io
      - events.k8s.io
      - external-secrets.io
      - externaldns.k8s.io
      - flowcontrol.apiserver.k8s.io
      - fluxcd.controlplane.io
      - gateway.networking.k8s.io
      - gateway.networking.x-k8s.io
      - generators.external-secrets.io
      - groupsnapshot.storage.k8s.io
      - helm.toolkit.fluxcd.io
      - hub.traefik.io
      - image.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - kyverno.io
      - metrics.k8s.io
      - monitoring.coreos.com
      - networking.k8s.io
      - node.k8s.io
      - notification.toolkit.fluxcd.io
      - objectbucket.io
      - operator.victoriametrics.com
      - policies.kyverno.io
      - policy
      - postgresql.cnpg.io
      - rbac.authorization.k8s.io
      - replication.storage.openshift.io
      - reports.kyverno.io
      - resource.k8s.io
      - scheduling.k8s.io
      - snapshot.storage.k8s.io
      - source.toolkit.fluxcd.io
      - storage.k8s.io
      - talos.dev
      - traefik.io
      - velero.io
      - wgpolicyk8s.io
    resources: ["*"]
    verbs: [get, list, watch]
  - nonResourceURLs: ["*"]
    verbs: [get]
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - serviceaccounts
      - persistentvolumeclaims
      - persistentvolumes
      - events
      - resourcequotas
      - limitranges
    verbs: [create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, update, patch]
  - apiGroups: [""]
    resources: [pods/exec, pods/attach, pods/portforward, pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch, update]
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/stats]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [batch]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [autoscaling.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [policy]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [storage.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [snapshot.storage.k8s.io, groupsnapshot.storage.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [node.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [scheduling.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups:
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - source.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
      - fluxcd.controlplane.io
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [cilium.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [cert-manager.io, acme.cert-manager.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [certificates.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [external-secrets.io, generators.external-secrets.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [ceph.rook.io, csi.ceph.io, csiaddons.openshift.io, objectbucket.io, replication.storage.openshift.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [postgresql.cnpg.io, barmancloud.cnpg.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [monitoring.coreos.com, operator.victoriametrics.com]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [kyverno.io, policies.kyverno.io, wgpolicyk8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [reports.kyverno.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [traefik.io, hub.traefik.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [velero.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [externaldns.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io, gateway.networking.x-k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [talos.dev]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [discovery.k8s.io, events.k8s.io, coordination.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [resource.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
  - apiGroups: [flowcontrol.apiserver.k8s.io]
    resources: ["*"]
    verbs: [create, update, patch, delete]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/clusterrolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coder-workspace-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: coder-workspace-ops
subjects:
  - kind: ServiceAccount
    name: coder-workspace-ops
    namespace: coder-workspaces
