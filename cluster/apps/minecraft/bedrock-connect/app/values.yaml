# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
fullnameOverride: bedrock-connect
defaultPodOptions:
  priorityClassName: low-priority
controllers:
  main:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        image:
          repository: pugmatt/bedrock-connect
          tag: "1.72.1@sha256:f3e7b7a6fa631bcdec33f8050c7f92e6a20f391a7aa9df322b4d406109782c67"
          pullPolicy: IfNotPresent
        # Image nests the jar in a same-named directory (https://github.com/Pugmatt/BedrockConnect/issues/728); remove once a release ships it at /docker/brc/BedrockConnect-1.0-SNAPSHOT.jar
        command:
          - java
          - -jar
          - /docker/brc/BedrockConnect-1.0-SNAPSHOT.jar/BedrockConnect-1.0-SNAPSHOT.jar
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
          - name: bedrock-udp
            containerPort: 19132
            protocol: UDP
          - name: bedrock-tcp
            containerPort: 19132
            protocol: TCP
        env:
          - name: JAVA_TOOL_OPTIONS
            value: "-Djava.net.preferIPv4Stack=true"
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
configMaps:
  config:
    enabled: true
    data:
      custom_servers.json: |-
        [
          {
            "name": "Fambam",
            "address": "minecraft.${EXTERNAL_DOMAIN}",
            "port": 19132
          }
        ]
      config.yml: |-
        custom_servers: /docker/brc/custom_servers.json
        packet_limit: 10000000
        advertise_addresses: ${BEDROCK_CONNECT_IP4}
        stun_discovery: false
service:
  udp:
    controller: main
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      lbipam.cilium.io/ips: "${BEDROCK_CONNECT_IP4}"
      lbipam.cilium.io/sharing-key: bedrock-connect
    ports:
      bedrock-udp:
        port: 19132
        enabled: true
        protocol: UDP
  tcp:
    controller: main
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      lbipam.cilium.io/ips: "${BEDROCK_CONNECT_IP4}"
      lbipam.cilium.io/sharing-key: bedrock-connect
    ports:
      bedrock-tcp:
        port: 19132
        enabled: true
        protocol: TCP
persistence:
  config:
    enabled: true
    type: configMap
    name: bedrock-connect
    advancedMounts:
      main:
        main:
          - path: /docker/brc/custom_servers.json
            readOnly: true
            subPath: custom_servers.json
          - path: /docker/brc/config.yml
            readOnly: true
            subPath: config.yml
  tmp:
    enabled: true
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /tmp
  # NetherNet identity.pem: clients pin its public key, so it must survive restarts
  nethernet:
    enabled: true
    type: persistentVolumeClaim
    existingClaim: bedrock-connect-nethernet
    advancedMounts:
      main:
        main:
          - path: /docker/brc/nethernet
  # Must be in WORKDIR (/docker/brc)
  players:
    enabled: true
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: /docker/brc/players
