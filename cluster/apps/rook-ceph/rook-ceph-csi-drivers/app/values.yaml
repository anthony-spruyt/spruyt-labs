---
operatorConfig:
  namespace: rook-ceph
  driverSpecDefaults:
    clusterName: rook-ceph
    imageSet:
      name: rook-csi-operator-image-set-configmap
    # Must stay >= 1: csi-addons sidecar v0.15.0+ rejects --v=0. Ref #2711.
    log:
      verbosity: 1
    nodePlugin:
      priorityClassName: system-node-critical
      kubeletDirPath: /var/lib/kubelet
      enableSeLinuxHostMount: false
      updateStrategy:
        type: RollingUpdate
    controllerPlugin:
      priorityClassName: system-cluster-critical
      hostNetwork: true
      replicas: 2
      deploymentStrategy:
        type: Recreate

drivers:
  rbd:
    enabled: true
    name: rook-ceph.rbd.csi.ceph.com
    # Chart renders log into the Driver CR, blocking the driverSpecDefaults
    # fallback - the per-driver value must be restated. Ref #2711.
    log:
      verbosity: 1
    snapshotPolicy: volumeSnapshot
    deployCsiAddons: true
    fsGroupPolicy: File
    encryption:
      configMapRef:
        name: rook-ceph-csi-kms-config
    nodePlugin:
      resources:
        plugin:
          limits:
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        registrar:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        liveness: {}
        addons: {}
        logRotator: {}
    controllerPlugin:
      hostNetwork: true
      replicas: 2
      priorityClassName: system-cluster-critical
      deploymentStrategy:
        type: Recreate
      resources:
        provisioner:
          requests:
            cpu: 100m
            memory: 128Mi
        resizer:
          requests:
            cpu: 100m
            memory: 128Mi
        attacher: {}
        snapshotter: {}
        omapGenerator: {}
        liveness: {}
        addons: {}
        logRotator: {}
        plugin: {}
  cephfs:
    enabled: true
    name: rook-ceph.cephfs.csi.ceph.com
    # Chart renders log into the Driver CR, blocking the driverSpecDefaults
    # fallback - the per-driver value must be restated. Ref #2711.
    log:
      verbosity: 1
    snapshotPolicy: volumeGroupSnapshot
    deployCsiAddons: true
    cephFsClientType: kernel
    fsGroupPolicy: File
    kernelMountOptions:
      ms_mode: secure
    nodePlugin:
      resources:
        plugin:
          limits:
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        registrar:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        liveness: {}
        addons: {}
        logRotator: {}
    controllerPlugin:
      hostNetwork: true
      replicas: 2
      priorityClassName: system-cluster-critical
      deploymentStrategy:
        type: Recreate
      resources:
        attacher:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        provisioner:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        resizer:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        snapshotter:
          limits:
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        plugin:
          limits:
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        omapGenerator: {}
        liveness: {}
        addons: {}
        logRotator: {}
  nfs:
    enabled: false
    name: rook-ceph.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-ceph.nvmeof.csi.ceph.com
