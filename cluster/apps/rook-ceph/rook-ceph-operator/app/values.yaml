# #yaml-language-server: $schema=TODO
# Rook Ceph Operator Helm Reference -> https://rook.io/docs/rook/v1.9/helm-operator.html#configuration
# Default values for rook-ceph operator: https://github.com/rook/rook/blob/master/deploy/charts/rook-ceph/values.yaml
priorityClassName: critical-infrastructure
crds:
  enabled: true
resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi
currentNamespaceOnly: true
csi:
  installCsiOperator: true
  csiAddons:
    repository: quay.io/csiaddons/k8s-sidecar
    # v0.15.0+ rejects --v=0; needs log.verbosity >= 1 in rook-ceph-csi-drivers.
    # renovate: depName=quay.io/csiaddons/k8s-sidecar datasource=docker versioning=docker
    tag: v0.15.0
  snapshotter:
    repository: registry.k8s.io/sig-storage/csi-snapshotter
    # renovate: depName=registry.k8s.io/sig-storage/csi-snapshotter datasource=docker versioning=docker
    tag: v8.6.0
enableDiscoveryDaemon: true
monitoring:
  enabled: true
