---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  chartRef:
    kind: OCIRepository
    name: rook-ceph-ocirepo
    namespace: flux-system
  interval: 4h
  valuesFrom:
    - kind: ConfigMap
      name: rook-ceph-operator-values
  # ceph-csi-operator does not watch the imageSet ConfigMap. Ref #2712
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: ceph-csi-controller-manager
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: ceph-csi-controller-manager
                annotations:
                  configmap.reloader.stakater.com/reload: rook-csi-operator-image-set-configmap
