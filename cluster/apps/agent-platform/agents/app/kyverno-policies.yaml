---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/validatingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: validate-agent-platform-pods
  annotations:
    policies.kyverno.io/title: Validate Agent Platform Pods
    policies.kyverno.io/category: Agent Platform
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Pods in agent-platform-agents must carry managed-by: agent-platform and
      set activeDeadlineSeconds between 1 and 3600. The per-run GitHub token
      expires after 1h, so an agent pod must not outlive it.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agent-platform-agents
  validations:
    - expression: "object.metadata.?labels[?'managed-by'].orValue('') == 'agent-platform'"
      message: "Pods in agent-platform-agents must be labelled managed-by: agent-platform"
    - expression: "object.spec.?activeDeadlineSeconds.orValue(0) >= 1 && object.spec.?activeDeadlineSeconds.orValue(0) <= 3600"
      message: "Agent pods must set activeDeadlineSeconds between 1 and 3600 (the agent token lifetime)"
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/policies.kyverno.io/deletingpolicy_v1.json
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-agent-platform-pods
  annotations:
    policies.kyverno.io/title: Cleanup Stale Agent Platform Pods
    policies.kyverno.io/description: >-
      Deletes agent pods older than 2h, in any phase. Backstop for the worker,
      which deletes each pod when its run ends. The pod's GitHub token is
      minted before the pod and expires after 1h, so a 2h-old pod has no
      working credentials left.
spec:
  schedule: "*/15 * * * *"
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: ["*"]
        resources: [pods]
        scope: Namespaced
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: agent-platform-agents
    objectSelector:
      matchLabels:
        managed-by: agent-platform
  conditions:
    - name: older-than-2h
      expression: time.now() - timestamp(object.metadata.creationTimestamp) > duration("2h")
