---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agent-platform-agents
  namespace: flux-system
spec:
  targetNamespace: agent-platform-agents
  path: ./cluster/apps/agent-platform/agents/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: kyverno
  prune: true
  timeout: 5m
  wait: true
