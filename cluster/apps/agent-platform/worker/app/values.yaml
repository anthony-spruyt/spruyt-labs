---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  priorityClassName: standard
  automountServiceAccountToken: true
  securityContext:
    runAsUser: 1654
    runAsGroup: 1654
    fsGroup: 1654
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  agent-platform-worker:
    annotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      name: agent-platform-worker
    initContainers:
      migrate:
        image:
          repository: ghcr.io/anthony-spruyt/agent-platform
          # renovate: datasource=docker depName=ghcr.io/anthony-spruyt/agent-platform
          tag: "1.2.1@sha256:9278395d72657ad0e65ab1377014f3b880ba283720dace3e64b1b7a7cffe4842"
          pullPolicy: IfNotPresent
        env:
          AgentPlatform__Role: Migrate
          ConnectionStrings__rundata:
            valueFrom:
              secretKeyRef:
                name: agent-platform-rundata
                key: ConnectionStrings__rundata
          OTEL_SERVICE_NAME: agent-platform-migrate
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry/v1/metrics
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria-logs-single-server.observability.svc:9428/insert/opentelemetry/v1/logs
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://victoria-traces-single-vt-single-server.observability.svc:10428/insert/opentelemetry/v1/traces
          TZ: ${TIMEZONE}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 150m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    containers:
      app:
        image:
          repository: ghcr.io/anthony-spruyt/agent-platform
          # renovate: datasource=docker depName=ghcr.io/anthony-spruyt/agent-platform
          tag: "1.2.1@sha256:9278395d72657ad0e65ab1377014f3b880ba283720dace3e64b1b7a7cffe4842"
          pullPolicy: IfNotPresent
        env:
          AgentPlatform__Role: Worker
          ASPNETCORE_HTTP_PORTS: "8080"
          AgentPods__MaxConcurrentActivities: "2"
          AgentGateway__SessionTokenKey:
            valueFrom:
              secretKeyRef:
                name: agent-platform-session
                key: session-token-key
          ConnectionStrings__rundata:
            valueFrom:
              secretKeyRef:
                name: agent-platform-rundata
                key: ConnectionStrings__rundata
          GitHub__AppId: "3233443"
          GitHub__PrivateKey:
            valueFrom:
              secretKeyRef:
                name: worker-credentials
                key: github-app-private-key
          Temporal__Address: temporal-frontend.temporal-system.svc:7233
          Temporal__Namespace: agent-platform
          OTEL_SERVICE_NAME: agent-platform-worker
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry/v1/metrics
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria-logs-single-server.observability.svc:9428/insert/opentelemetry/v1/logs
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://victoria-traces-single-vt-single-server.observability.svc:10428/insert/opentelemetry/v1/traces
          TZ: ${TIMEZONE}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 150m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /alive
                port: 8080
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /alive
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  rundata-ca:
    type: secret
    name: agent-platform-rundata
    advancedMounts:
      agent-platform-worker:
        migrate:
          - path: /etc/agent-platform/rundata-ca/ca.crt
            subPath: ca.crt
            readOnly: true
        app:
          - path: /etc/agent-platform/rundata-ca/ca.crt
            subPath: ca.crt
            readOnly: true
