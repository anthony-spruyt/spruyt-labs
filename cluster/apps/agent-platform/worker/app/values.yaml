---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  priorityClassName: standard
  automountServiceAccountToken: true
  securityContext:
    runAsUser: 1654
    runAsGroup: 1654
    fsGroup: 1654
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  agent-platform-worker:
    annotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      name: agent-platform-worker
    initContainers:
      migrate:
        image:
          repository: docker.io/aspruyt/agent-platform
          # renovate: datasource=docker depName=docker.io/aspruyt/agent-platform
          tag: "1.20.2@sha256:eb761f10bf3a77b6dbf9fb057004f1a82fa68ed9dd4ca6a14a72ca02d32d5bc2"
          pullPolicy: IfNotPresent
        env:
          AgentPlatform__Role: Migrate
          ConnectionStrings__rundata:
            valueFrom:
              secretKeyRef:
                name: agent-platform-rundata
                key: ConnectionStrings__rundata
          OTEL_SERVICE_NAME: agent-platform-migrate
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry/v1/metrics
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria-logs-single-server.observability.svc:9428/insert/opentelemetry/v1/logs
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://victoria-traces-single-vt-single-server.observability.svc:10428/insert/opentelemetry/v1/traces
          TZ: ${TIMEZONE}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 150m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
    containers:
      app:
        image:
          repository: docker.io/aspruyt/agent-platform
          # renovate: datasource=docker depName=docker.io/aspruyt/agent-platform
          tag: "1.20.2@sha256:eb761f10bf3a77b6dbf9fb057004f1a82fa68ed9dd4ca6a14a72ca02d32d5bc2"
          pullPolicy: IfNotPresent
        env:
          AgentPlatform__Role: Worker
          ASPNETCORE_HTTP_PORTS: "8080"
          # renovate: datasource=docker depName=docker.io/aspruyt/claude-agent-read
          AgentPods__Image: "docker.io/aspruyt/claude-agent-read:1.1.11@sha256:fd9a106e255d4c26ab24d47cce76d81ad70f5baa95c87f03219922368589f65f"
          AgentPods__MaxConcurrentActivities: "1"
          AgentPods__Model: opus
          AgentPrompts__Directory: /etc/agent-platform/prompts
          AgentGateway__SessionTokenKey:
            valueFrom:
              secretKeyRef:
                name: agent-platform-session
                key: session-token-key
          ConnectionStrings__rundata:
            valueFrom:
              secretKeyRef:
                name: agent-platform-rundata
                key: ConnectionStrings__rundata
          GitHub__AppId: "3233443"
          GitHub__PrivateKey:
            valueFrom:
              secretKeyRef:
                name: worker-credentials
                key: github-app-private-key
          GitHub__ReadApp__AppId: "3233491"
          GitHub__ReadApp__PrivateKey:
            valueFrom:
              secretKeyRef:
                name: worker-credentials
                key: github-read-app-private-key
          LiteLlm__BaseUrl: http://litellm.litellm.svc:4000
          LiteLlm__ApiKey:
            valueFrom:
              secretKeyRef:
                name: worker-credentials
                key: litellm-virtual-key
          LiteLlm__JevPath: v1/systemone
          LiteLlm__JevModel: jev-1.14.0
          RenovateTriage__Mode: Live
          RenovateTriage__Claude__MaxPerHour: "4"
          RenovateTriage__Claude__MaxPerDay: "32"
          RenovateTriage__Claude__MaxPerPrPerDay: "2"
          Temporal__Address: temporal-frontend.temporal-system.svc:7233
          Temporal__Namespace: agent-platform
          OTEL_SERVICE_NAME: agent-platform-worker
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry/v1/metrics
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria-logs-single-server.observability.svc:9428/insert/opentelemetry/v1/logs
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://victoria-traces-single-vt-single-server.observability.svc:10428/insert/opentelemetry/v1/traces
          TZ: ${TIMEZONE}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 150m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /alive
                port: 8080
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /alive
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
  rundata-ca:
    type: secret
    name: agent-platform-rundata
    advancedMounts:
      agent-platform-worker:
        migrate:
          - path: /etc/agent-platform/rundata-ca/ca.crt
            subPath: ca.crt
            readOnly: true
        app:
          - path: /etc/agent-platform/rundata-ca/ca.crt
            subPath: ca.crt
            readOnly: true
  prompts:
    type: configMap
    name: agent-platform-worker-prompts
    advancedMounts:
      agent-platform-worker:
        app:
          - path: /etc/agent-platform/prompts
            readOnly: true
