---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: temporal-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: temporal-system
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: temporal-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-platform-rundata
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: temporal-secret-store
  target:
    name: agent-platform-rundata
    creationPolicy: Owner
    template:
      data:
        ConnectionStrings__rundata: "Host=temporal-cnpg-cluster-rw.temporal-system.svc;Port=5432;Database=agent_platform;Username=agent_platform;Password={{ .password }};SSL Mode=VerifyFull;Root Certificate=/etc/agent-platform/rundata-ca/ca.crt;Maximum Pool Size=10"
        ca.crt: "{{ .ca }}"
  data:
    - secretKey: password
      remoteRef:
        key: temporal-cnpg-agent-platform
        property: password
    - secretKey: ca
      remoteRef:
        key: temporal-cnpg-ca-public
        property: ca.crt
