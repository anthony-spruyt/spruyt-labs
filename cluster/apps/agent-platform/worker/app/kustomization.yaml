---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./rbac.yaml
  - ./network-policies.yaml
  - ./worker-credentials.sops.yaml
  - ./run-data-eso.yaml
  - ./release.yaml
  - ./vmrule.yaml
  - ./vpa.yaml
configMapGenerator:
  - name: agent-platform-worker-values
    namespace: agent-platform
    files:
      - values.yaml
  - name: agent-platform-worker-prompts
    namespace: agent-platform
    files:
      - prompts/renovate-triage.md
    options:
      disableNameSuffixHash: true
configurations:
  - ./kustomizeconfig.yaml
