spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: agent-platform-worker
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: temporal-system
            k8s:app.kubernetes.io/instance: temporal
            k8s:app.kubernetes.io/name: temporal
            k8s:app.kubernetes.io/component: frontend
      toPorts:
        - ports:
            - port: "7233"
              protocol: TCP
