---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
global:
  createDefaultServiceAccount: false
defaultPodOptions:
  priorityClassName: standard
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1654
    runAsGroup: 1654
    fsGroup: 1654
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  agent-platform-web:
    strategy: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    annotations:
      reloader.stakater.com/auto: "true"
    serviceAccount:
      name: agent-platform-web
    containers:
      app:
        image:
          repository: docker.io/aspruyt/agent-platform
          # renovate: datasource=docker depName=docker.io/aspruyt/agent-platform
          tag: "1.27.1@sha256:50ba1e0f4b559ec60e56f9c66441f30aa83be764ef5da7bb4af5a41f91af31ba"
          pullPolicy: IfNotPresent
        lifecycle:
          preStop:
            sleep:
              seconds: 5
        env:
          AgentPlatform__Role: Web
          ASPNETCORE_HTTP_PORTS: "8080;8081"
          AgentGateway__Port: "8081"
          AgentGateway__SessionTokenKey:
            valueFrom:
              secretKeyRef:
                name: agent-platform-session
                key: session-token-key
          GitHub__AppId: "3233443"
          GitHub__WebhookSecret:
            valueFrom:
              secretKeyRef:
                name: web-credentials
                key: github-webhook-secret
          Temporal__Address: temporal-frontend.temporal-system.svc:7233
          Temporal__Namespace: agent-platform
          Livemap__Enabled: "true"
          Livemap__Repo: anthony-spruyt/enshrouded-livemap
          Livemap__PinRepo: anthony-spruyt/spruyt-labs
          Livemap__PinPath: cluster/apps/enshrouded/enshrouded/app/livemap-pin.yaml
          Livemap__TrackingIssue: "28"
          Livemap__AutoMerge: "true"
          Livemap__HardPath: "true"
          Livemap__RequiredChecks__0: "lint / MegaLinter"
          Livemap__RequiredChecks__1: "repo / Build, test, package"
          Livemap__RequiredChecks__2: "repo / Boot the server with the DLL"
          Livemap__RequiredChecks__3: "repo / data-only"
          Livemap__RequiredChecks__4: "repo / Build and test the compat tool"
          Livemap__RequiredChecks__5: "repo / Classify the pull request"
          Livemap__RequiredChecks__6: "summary / Check Results"
          Livemap__ReleaseBot: "repo-operator-release-bot[bot]"
          Livemap__ReleaseRequiredChecks__0: "lint / MegaLinter"
          Livemap__ReleaseRequiredChecks__1: "repo / Build, test, package"
          Livemap__ReleaseRequiredChecks__2: "repo / Boot the server with the DLL"
          Livemap__ReleaseRequiredChecks__3: "repo / Build and test the compat tool"
          Livemap__ReleaseRequiredChecks__4: "repo / Classify the pull request"
          Livemap__ReleaseRequiredChecks__5: "summary / Check Results"
          OTEL_SERVICE_NAME: agent-platform-web
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428/opentelemetry/v1/metrics
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://victoria-logs-single-server.observability.svc:9428/insert/opentelemetry/v1/logs
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://victoria-traces-single-vt-single-server.observability.svc:10428/insert/opentelemetry/v1/traces
          TZ: ${TIMEZONE}
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 150m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /alive
                port: 8080
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 36
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /alive
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
service:
  app:
    controller: agent-platform-web
    ports:
      webhooks:
        port: 8080
      mcp:
        port: 8081
persistence:
  tmp:
    type: emptyDir
    globalMounts:
      - path: /tmp
