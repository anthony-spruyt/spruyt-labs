---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agent-platform-session
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Generated once: a new key invalidates the session tokens of runs in flight.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-platform-session
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-platform-session
    creationPolicy: Orphan
    immutable: true
    template:
      data:
        session-token-key: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agent-platform-session
