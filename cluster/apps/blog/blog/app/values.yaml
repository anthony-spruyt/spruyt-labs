---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: low-priority
controllers:
  blog:
    pod:
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    replicas: 1
    containers:
      blog:
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        image:
          repository: ghcr.io/anthony-spruyt/blog
          tag: 1.2.0@sha256:5cf501d02d4b14e1a85881b0032841c469664093516f20b410273ed11e173569
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 20m
            memory: 64Mi
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
service:
  blog:
    controller: blog
    ports:
      http:
        port: 8080
