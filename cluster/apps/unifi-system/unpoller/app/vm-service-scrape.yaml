---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/operator.victoriametrics.com/vmservicescrape_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: unpoller
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: unpoller
      app.kubernetes.io/name: unpoller
      app.kubernetes.io/service: unpoller
  namespaceSelector:
    matchNames:
      - unifi-system
  endpoints:
    # No scrape credentials: UnPoller's /metrics has no auth option, so access is set by allow-metrics-ingress.
    - port: http
      path: /metrics
      # Matches UP_PROMETHEUS_INTERVAL; the endpoint serves a cached snapshot
      # refreshed on that cadence, so scraping faster only duplicates samples.
      interval: 60s
      scrapeTimeout: 30s
