---
apiVersion: v1
kind: Namespace
metadata:
  name: enshrouded
  labels:
    # baseline (not restricted): the image starts supervisord as root and drops to PUID/PGID itself.
    # baseline still blocks hostPath, hostNetwork and privileged containers.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
