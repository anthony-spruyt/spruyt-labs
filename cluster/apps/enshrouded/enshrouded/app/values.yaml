---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: low-priority
  automountServiceAccountToken: false
controllers:
  enshrouded:
    annotations:
      reloader.stakater.com/auto: "true"
    replicas: 1
    type: statefulset
    pod:
      # supervisord stopwaitsecs is 90; the rest covers stopping crond and rsyslog after the server
      terminationGracePeriodSeconds: 120
      # Avoid co-locating with vmsingle - both are heavy CPU/memory consumers
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: [vmsingle]
                namespaces: ["observability"]
                topologyKey: kubernetes.io/hostname
      securityContext:
        # Image starts supervisord as root and drops to PUID/PGID itself
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
    containers:
      app:
        image:
          repository: mornedhels/enshrouded-server
          tag: "1.8.1-wine@sha256:002a8ac3387eddc5151b18ab5e7c02f9382f8e941dcfc75e56fa5134bd18f283"
          pullPolicy: IfNotPresent
        # Wine gives every new thread the CPU mask its first process started with, so pin before bootstrap starts
        command:
          - sh
          - -c
          - |
            cpus="$(cat /sys/devices/cpu_core/cpus 2>/dev/null)"
            [ -n "$cpus" ] && exec taskset -c "$cpus" /usr/local/etc/enshrouded/bootstrap
            exec /usr/local/etc/enshrouded/bootstrap
        env:
          TZ: ${TIMEZONE}
          SERVER_NAME: Ember Kelmire
          SERVER_SAVE_DIR: /opt/enshrouded-saves
          SERVER_SLOT_COUNT: "16"
          SERVER_ENABLE_TEXT_CHAT: "true"
          SERVER_ENABLE_VOICE_CHAT: "true"
          SERVER_VOICE_CHAT_MODE: Proximity
          UPDATE_CRON: "*/30 * * * *"
          UPDATE_CHECK_PLAYERS: "true"
          BACKUP_CRON: "0 * * * *"
          BACKUP_MAX_COUNT: "48"
          SERVER_ROLE_0_NAME: Admin
          SERVER_ROLE_0_CAN_KICK_BAN: "true"
          SERVER_ROLE_0_CAN_ACCESS_INVENTORIES: "true"
          SERVER_ROLE_0_CAN_EDIT_WORLD: "true"
          SERVER_ROLE_0_CAN_EDIT_BASE: "true"
          SERVER_ROLE_0_CAN_EXTEND_BASE: "true"
          SERVER_ROLE_0_RESERVED_SLOTS: "1"
          SERVER_ROLE_0_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: enshrouded-secrets
                key: ADMIN_PWD
          SERVER_ROLE_1_NAME: Friend
          SERVER_ROLE_1_CAN_KICK_BAN: "false"
          SERVER_ROLE_1_CAN_ACCESS_INVENTORIES: "true"
          SERVER_ROLE_1_CAN_EDIT_WORLD: "true"
          SERVER_ROLE_1_CAN_EDIT_BASE: "true"
          SERVER_ROLE_1_CAN_EXTEND_BASE: "true"
          SERVER_ROLE_1_RESERVED_SLOTS: "3"
          SERVER_ROLE_1_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: enshrouded-secrets
                key: FRIEND_PWD
          SERVER_ROLE_2_NAME: Guest
          SERVER_ROLE_2_CAN_KICK_BAN: "false"
          SERVER_ROLE_2_CAN_ACCESS_INVENTORIES: "false"
          SERVER_ROLE_2_CAN_EDIT_WORLD: "true"
          SERVER_ROLE_2_CAN_EDIT_BASE: "false"
          SERVER_ROLE_2_CAN_EXTEND_BASE: "false"
          SERVER_ROLE_2_RESERVED_SLOTS: "0"
          SERVER_ROLE_2_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: enshrouded-secrets
                key: GUEST_PWD
          SERVER_ROLE_3_NAME: Visitor
          SERVER_ROLE_3_CAN_KICK_BAN: "false"
          SERVER_ROLE_3_CAN_ACCESS_INVENTORIES: "false"
          SERVER_ROLE_3_CAN_EDIT_WORLD: "false"
          SERVER_ROLE_3_CAN_EDIT_BASE: "false"
          SERVER_ROLE_3_CAN_EXTEND_BASE: "false"
          SERVER_ROLE_3_RESERVED_SLOTS: "0"
          SERVER_ROLE_3_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: enshrouded-secrets
                key: VISITOR_PWD
          # Other SERVER_GS_ knobs only apply with preset Custom
          SERVER_GS_PRESET: Custom # Default, Relaxed, Hard, Survival, Custom
          # SERVER_GS_PRESET: Default
          # SERVER_GS_PRESET: Relaxed
          # SERVER_GS_PRESET: Hard
          # SERVER_GS_PRESET: Survival
          SERVER_GS_PLAYER_HEALTH_FACTOR: "1" # 0.25-4, player max health
          SERVER_GS_PLAYER_MANA_FACTOR: "1" # 0.25-4, player max mana
          SERVER_GS_PLAYER_STAMINA_FACTOR: "1" # 0.25-4, player max stamina
          SERVER_GS_PLAYER_BODY_HEAT_FACTOR: "1" # 0.5-2, body heat before hypothermia
          SERVER_GS_PLAYER_DIVING_TIME_FACTOR: "1" # 0.5-2, oxygen / time underwater
          SERVER_GS_ENABLE_DURABILITY: "true" # weapon durability
          # SERVER_GS_ENABLE_DURABILITY: "false"
          SERVER_GS_ENABLE_STARVING_DEBUFF: "false" # hunger and starvation
          # SERVER_GS_ENABLE_STARVING_DEBUFF: "true"
          SERVER_GS_FOOD_BUFF_DURATION_FACTOR: "1" # 0.5-2, food buff duration
          SERVER_GS_FROM_HUNGER_TO_STARVING: "600000000000" # 5-20 min, 1 min = 60000000000, hungry before starving
          SERVER_GS_SHROUD_TIME_FACTOR: "1" # 0.5-2, time allowed in the Shroud
          SERVER_GS_FLAME_LEVEL_FOG_REMOVAL: "11" # 0-20, Flame level to place Flame Altars in the Shroud
          SERVER_GS_ENABLE_GLIDER_TURBULENCES: "true" # glider air turbulence
          # SERVER_GS_ENABLE_GLIDER_TURBULENCES: "false"
          SERVER_GS_WEATHER_FREQUENCY: Normal # how often weather happens
          # SERVER_GS_WEATHER_FREQUENCY: Disabled
          # SERVER_GS_WEATHER_FREQUENCY: Rare
          # SERVER_GS_WEATHER_FREQUENCY: Often
          SERVER_GS_FISHING_DIFFICULTY: Normal # fish strength in the fishing minigame
          # SERVER_GS_FISHING_DIFFICULTY: VeryEasy
          # SERVER_GS_FISHING_DIFFICULTY: Easy
          # SERVER_GS_FISHING_DIFFICULTY: Hard
          # SERVER_GS_FISHING_DIFFICULTY: VeryHard
          SERVER_GS_RANDOM_SPAWNER_AMOUNT: Automatic # amount of enemies in the world
          # SERVER_GS_RANDOM_SPAWNER_AMOUNT: Few
          # SERVER_GS_RANDOM_SPAWNER_AMOUNT: Normal
          # SERVER_GS_RANDOM_SPAWNER_AMOUNT: Many
          # SERVER_GS_RANDOM_SPAWNER_AMOUNT: Extreme
          SERVER_GS_MINING_DAMAGE_FACTOR: "1" # 0.5-2, mining damage and yield
          SERVER_GS_PLANT_GROWTH_SPEED_FACTOR: "1" # 0.25-2, plant growth speed
          SERVER_GS_RESOURCE_DROP_STACK_AMOUNT_FACTOR: "1" # 0.25-2, materials per loot stack
          SERVER_GS_FACTORY_PRODUCTION_SPEED_FACTOR: "1" # 0.25-2, workshop production time
          SERVER_GS_PERK_UPGRADE_RECYCLING_FACTOR: "0.5" # 0-1, Runes returned when salvaging upgraded weapons
          SERVER_GS_PERK_COST_FACTOR: "1" # 0.25-2, Runes needed to upgrade weapons
          SERVER_GS_EXPERIENCE_COMBAT_FACTOR: "1" # 0.25-2, XP from combat
          SERVER_GS_EXPERIENCE_MINING_FACTOR: "1" # 0-2, XP from mining
          SERVER_GS_EXPERIENCE_EXPLORATION_QUESTS_FACTOR: "1" # 0.25-2, XP from exploring and quests
          SERVER_GS_AGGRO_POOL_AMOUNT: Normal # enemies allowed to attack at once
          # SERVER_GS_AGGRO_POOL_AMOUNT: Few
          # SERVER_GS_AGGRO_POOL_AMOUNT: Many
          # SERVER_GS_AGGRO_POOL_AMOUNT: Extreme
          SERVER_GS_ENEMY_DAMAGE_FACTOR: "1" # 0.25-5, enemy damage (not bosses)
          SERVER_GS_ENEMY_HEALTH_FACTOR: "1" # 0.25-4, enemy health (not bosses)
          SERVER_GS_ENEMY_STAMINA_FACTOR: "1" # 0.5-2, enemy stamina (not bosses)
          SERVER_GS_ENEMY_PERCEPTION_RANGE_FACTOR: "1" # 0.5-2, enemy sight and hearing range (not bosses)
          SERVER_GS_BOSS_DAMAGE_FACTOR: "1" # 0.2-5, boss damage
          SERVER_GS_BOSS_HEALTH_FACTOR: "1" # 0.2-5, boss health
          SERVER_GS_THREAT_BONUS: "1" # 0.25-4, frequency of enemy attacks (not bosses)
          SERVER_GS_PACIFY_ALL_ENEMIES: "false" # enemies attack only when attacked (not bosses)
          # SERVER_GS_PACIFY_ALL_ENEMIES: "true"
          SERVER_GS_TAMING_STARTLE_REPERCUSSION: LoseSomeProgress # progress lost when startling wildlife while taming
          # SERVER_GS_TAMING_STARTLE_REPERCUSSION: KeepProgress
          # SERVER_GS_TAMING_STARTLE_REPERCUSSION: LoseAllProgress
          SERVER_GS_DAY_TIME_DURATION: "1800000000000" # 2-60 min, 1 min = 60000000000, daytime length
          SERVER_GS_NIGHT_TIME_DURATION: "720000000000" # 2-60 min, 1 min = 60000000000, nighttime length
          SERVER_GS_TOMBSTONE_MODE: AddBackpackMaterials # what is lost in the backpack on death
          # SERVER_GS_TOMBSTONE_MODE: Everything
          # SERVER_GS_TOMBSTONE_MODE: NoTombstone
          SERVER_GS_CURSE_MODIFIER: Normal # chance of being cursed, Easy disables curses
          # SERVER_GS_CURSE_MODIFIER: Easy
          # SERVER_GS_CURSE_MODIFIER: Hard
          WINEDLLOVERRIDES: "iphlpapi=n,b"
          BOOTSTRAP_HOOK: "timeout 300 bash /opt/livemap/livemap-install.sh || true"
          LIVEMAP_PUBLIC_URL: https://enshrouded-map.${EXTERNAL_DOMAIN}
          # renovate: depName=oggii/enshrouded-livemap datasource=github-release-attachments digest=sha256
          LIVEMAP_VERSION: "v1.7.0"
          LIVEMAP_SHA256: "edb1c346b3d245307239de8b2561713c04d2b49170011b98f3e718c760d325b9"
          LIVEMAP_KEY:
            valueFrom:
              secretKeyRef:
                name: enshrouded-livemap-key
                key: LIVEMAP_KEY
        resources:
          requests:
            cpu: 3000m
            memory: 6Gi
          limits:
            cpu: 6000m
            memory: 12Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
            add:
              # Entrypoint chowns /opt/enshrouded to PUID:PGID on every start
              - CHOWN
              # root must reach files and the supervisor socket owned by the PUID user
              - DAC_OVERRIDE
              # Entrypoint remaps the enshrouded user; supervisord drops each program to it
              - SETUID
              - SETGID
              # supervisord signals child processes to stop the server and cron jobs
              - KILL
        ports:
          - name: game
            containerPort: 15637
            protocol: UDP
          - name: map
            containerPort: 15637
            protocol: TCP
        probes:
          # First start downloads the game via steamcmd: allow up to 60 minutes
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - sh
                  - -c
                  - supervisorctl status enshrouded-server | grep -q RUNNING
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 120
          # STOPPED is normal while the updater patches; FATAL or an unreachable supervisord is not
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - sh
                  - -c
                  - supervisorctl status enshrouded-server | grep -Eq 'RUNNING|STARTING|BACKOFF|STOPPED|EXITED'
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 10
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - sh
                  - -c
                  - supervisorctl status enshrouded-server | grep -q RUNNING
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 3
persistence:
  game:
    existingClaim: "enshrouded-game"
    advancedMounts:
      enshrouded:
        app:
          - path: /opt/enshrouded
  saves:
    existingClaim: "enshrouded-saves"
    advancedMounts:
      enshrouded:
        app:
          - path: /opt/enshrouded-saves
          - path: /opt/enshrouded/server/livemap
            subPath: livemap
  livemap-script:
    type: configMap
    name: enshrouded-livemap-script
    defaultMode: 0755
    advancedMounts:
      enshrouded:
        app:
          - path: /opt/livemap
            readOnly: true
service:
  game:
    controller: enshrouded
    forceRename: enshrouded
    type: LoadBalancer
    annotations:
      lbipam.cilium.io/ips: "${ENSHROUDED_IP4}"
      external-dns.kubernetes.io/hostname: enshrouded.${EXTERNAL_DOMAIN}
    externalTrafficPolicy: Local
    ports:
      game:
        port: 15637
        protocol: UDP
  map:
    controller: enshrouded
    type: ClusterIP
    ports:
      map:
        port: 15637
        protocol: TCP
