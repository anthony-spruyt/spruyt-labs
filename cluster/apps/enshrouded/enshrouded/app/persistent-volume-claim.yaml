---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/persistentvolumeclaim.json
# Documentation: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#persistentvolumeclaims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enshrouded-game
  namespace: enshrouded
spec:
  storageClassName: rbd-fast-delete
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: enshrouded-saves
  namespace: enshrouded
  labels:
    velero.io/backup-volumes: "true"
spec:
  storageClassName: rbd-fast-delete
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
