---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-app-write
spec:
  appIDRef:
    name: github-app-credentials
    key: write-app-id
  installIDRef:
    name: github-app-credentials
    key: write-installation-id
  auth:
    privateKey:
      secretRef:
        name: github-app-credentials
        key: write-private-key
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/generators.external-secrets.io/githubaccesstoken_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: github-app-read
spec:
  appIDRef:
    name: github-app-credentials
    key: read-app-id
  installIDRef:
    name: github-app-credentials
    key: read-installation-id
  auth:
    privateKey:
      secretRef:
        name: github-app-credentials
        key: read-private-key
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# GitHub installation tokens expire after 60m: keep refreshInterval below that
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-tokens-probe
spec:
  refreshInterval: 30m
  target:
    name: github-app-tokens-probe
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        write-access-token: '{{ index . "write-token" }}'
        write-hosts.yml: |-
          github.com:
            oauth_token: {{ index . "write-token" }}
            user: spruyt-labs-bot
        read-access-token: '{{ index . "read-token" }}'
        read-hosts.yml: |-
          github.com:
            oauth_token: {{ index . "read-token" }}
            user: spruyt-labs-bot
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-app-write
      rewrite:
        - regexp:
            source: "^(.*)$"
            target: "write-$1"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: github-app-read
      rewrite:
        - regexp:
            source: "^(.*)$"
            target: "read-$1"
