---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: coder-ssh-key-rotation
spec:
  groups:
    - name: coder-ssh-key-rotation
      rules:
        - alert: CoderSSHKeyRotationFailed
          expr: |
            kube_job_status_failed{namespace="github-system", job_name=~"coder-ssh-key-rotation.*"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Coder SSH key rotation CronJob failed"
            description: "CronJob {{ $labels.job_name }} failed. Coder SSH key was not rotated."
        # Must stay below GRACE_PERIOD_DAYS (8d) so it fires before workspace keys expire
        - alert: CoderSSHKeyRotationConsecutiveFailures
          expr: |
            time() - kube_cronjob_status_last_successful_time{namespace="github-system", cronjob="coder-ssh-key-rotation"} > 432000
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Coder SSH key rotation has not succeeded in 5+ days"
            description: "The Coder workspace SSH key has not been rotated in over 5 days."
