---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-brave-search-api-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: brave-search-mcp
  egress:
    - toFQDNs:
        - matchName: api.search.brave.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-litellm-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: brave-search-mcp
  ingress:
    - fromEndpoints:
        # Keep the controller label: every pod in the litellm release carries app.kubernetes.io/name: litellm.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            k8s:app.kubernetes.io/name: litellm
            k8s:app.kubernetes.io/controller: litellm
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
