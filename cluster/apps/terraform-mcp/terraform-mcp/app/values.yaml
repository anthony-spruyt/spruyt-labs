---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: low-priority
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
controllers:
  terraform-mcp:
    strategy: Recreate
    containers:
      app:
        image:
          repository: docker.io/hashicorp/terraform-mcp-server
          tag: 1.3.0@sha256:423a6b8e2ee06affcf090892f40c86469caba45fd2448ffa8ca5d717a174f7d5
          pullPolicy: IfNotPresent
        args:
          - streamable-http
          - --transport-host=0.0.0.0
          - --transport-port=8080
          - --toolsets=all
        env:
          - name: TFE_ADDRESS
            value: "https://app.terraform.io"
          - name: TFE_TOKEN
            valueFrom:
              secretKeyRef:
                name: terraform-mcp-secrets
                key: TFE_TOKEN
          - name: ENABLE_TF_OPERATIONS
            value: "true"
          - name: MCP_SESSION_MODE
            value: "stateless"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 512Mi
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
service:
  app:
    controller: terraform-mcp
    ports:
      http:
        port: 8080
