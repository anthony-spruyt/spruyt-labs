---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: standard
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  happy-server:
    strategy: Recreate
    annotations:
      reloader.stakater.com/auto: "true"
    containers:
      app:
        image:
          repository: ghcr.io/anthony-spruyt/happy-server
          tag: 1.0.1@sha256:29d7571b3a28addc2f99e00f8a17bd40ce753722c2abe10d172b2949a51fd961
          pullPolicy: IfNotPresent
        env:
          PUBLIC_URL: https://happy.${EXTERNAL_DOMAIN}
          TZ: ${TIMEZONE}
        envFrom:
          - secretRef:
              name: happy-server-master-secret
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 150m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &port 3005
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *port
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness: *probes
service:
  app:
    controller: happy-server
    ports:
      http:
        port: *port
persistence:
  data:
    existingClaim: happy-server-data
    globalMounts:
      - path: /data
  tmp:
    type: emptyDir
  # Hides the webapp so / returns the banner the app's server check needs; drop once slopus/happy#501 is fixed.
  webapp:
    type: emptyDir
    globalMounts:
      - path: /usr/local/lib/node_modules/happy-server-self-host/webapp
