---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: happy-server-master-secret
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Generated once: a new master secret invalidates every client token, so every device must pair again.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: happy-server-master-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: happy-server-master-secret
    creationPolicy: Orphan
    immutable: true
    template:
      data:
        HANDY_MASTER_SECRET: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: happy-server-master-secret
