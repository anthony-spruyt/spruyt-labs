---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: temporal-cnpg-daily-scheduled-backup
spec:
  immediate: true
  schedule: "0 40 15 * * *" # At 01:40 daily Melbourne (UTC+10)
  cluster:
    name: temporal-cnpg-cluster
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  backupOwnerReference: self
