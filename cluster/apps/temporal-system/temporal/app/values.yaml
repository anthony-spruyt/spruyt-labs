---
# Documentation: https://github.com/temporalio/helm-charts/blob/main/README.md
# Default values: https://github.com/temporalio/helm-charts/blob/main/charts/temporal/values.yaml
server:
  image:
    repository: temporalio/server
    tag: 1.32.2@sha256:7bf69188a6232fea14869b9cef3d94aa82a1601d99517f7e86c71f22da4e0670
  priorityClassName: standard
  versionCheckDisabled: true
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  metrics:
    serviceMonitor:
      enabled: true
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  additionalVolumes:
    - name: postgres-ca
      secret:
        secretName: temporal-cnpg-cluster-ca
        items:
          - key: ca.crt
            path: ca.crt
  additionalVolumeMounts:
    - name: postgres-ca
      mountPath: /etc/temporal/tls/postgres
      readOnly: true
  config:
    logLevel: info
    persistence:
      defaultStore: default
      visibilityStore: visibility
      # Immutable after first deploy. Changing it requires wiping both databases.
      numHistoryShards: 512
      datastores:
        default:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal
            connectAddr: temporal-cnpg-cluster-rw.temporal-system.svc:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-cnpg-owner
            secretKey: password
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: 1h
            tls:
              enabled: true
              enableHostVerification: true
              serverName: temporal-cnpg-cluster-rw.temporal-system.svc
              caFile: /etc/temporal/tls/postgres/ca.crt
        visibility:
          sql:
            createDatabase: false
            manageSchema: true
            pluginName: postgres12
            driverName: postgres12
            databaseName: temporal_visibility
            connectAddr: temporal-cnpg-cluster-rw.temporal-system.svc:5432
            connectProtocol: tcp
            user: temporal
            existingSecret: temporal-cnpg-owner
            secretKey: password
            maxConns: 10
            maxIdleConns: 10
            maxConnLifetime: 1h
            tls:
              enabled: true
              enableHostVerification: true
              serverName: temporal-cnpg-cluster-rw.temporal-system.svc
              caFile: /etc/temporal/tls/postgres/ca.crt
    namespaces:
      create: true
      useHelmHooks: false
      namespace:
        - name: default
          retention: 3d
        - name: agent-platform
          retention: 14d
  frontend:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    containerSecurityContext: &serverContainerSecurityContext
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL
  history:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 2Gi
    containerSecurityContext: *serverContainerSecurityContext
  matching:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    containerSecurityContext: *serverContainerSecurityContext
  worker:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    containerSecurityContext: *serverContainerSecurityContext

admintools:
  enabled: true
  image:
    repository: temporalio/admin-tools
    tag: 1.32.2@sha256:4a95866efba29d7e17ab012df5232795e8b0ad0f7d5f9d1ec4df321f7792a754
  priorityClassName: standard
  deploymentAnnotations:
    reloader.stakater.com/auto: "true"
  additionalVolumes:
    - name: postgres-ca
      secret:
        secretName: temporal-cnpg-cluster-ca
        items:
          - key: ca.crt
            path: ca.crt
  additionalVolumeMounts:
    - name: postgres-ca
      mountPath: /etc/temporal/tls/postgres
      readOnly: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

web:
  enabled: true
  image:
    repository: temporalio/ui
    tag: 2.58.1@sha256:ac3c13eddb4547d830991bb5eee93a5d97140134522b7297fdb2be1fe25ef925
  priorityClassName: standard
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL

schema:
  # Helm hooks do not work with Flux; plain Jobs run on every revision instead.
  useHelmHooks: false
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
    capabilities:
      drop:
        - ALL
