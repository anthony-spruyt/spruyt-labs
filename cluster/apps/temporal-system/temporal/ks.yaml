---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app temporal
  namespace: flux-system
spec:
  targetNamespace: temporal-system
  path: ./cluster/apps/temporal-system/temporal/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cnpg-operator
    - name: external-secrets
    - name: plugin-barman-cloud
    - name: traefik
    - name: authentik
  prune: true
  # Must exceed the Kyverno-injected HelmRelease timeout (10m); first deploy also bootstraps CNPG.
  timeout: 15m
  retryInterval: 5m
  wait: true
