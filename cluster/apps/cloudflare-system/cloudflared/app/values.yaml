---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: critical-infrastructure
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: cloudflared
controllers:
  cloudflared:
    annotations:
      reloader.stakater.com/auto: "true"
    replicas: 3
    strategy: RollingUpdate
    rollingUpdate:
      # No surge: tainted control-plane nodes count as empty spread domains, so a 4th pod stays Pending.
      maxSurge: 0
      maxUnavailable: 1
    pod:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          # Allows ICMP traffic (ping, traceroute) to resources behind cloudflared.
          - name: net.ipv4.ping_group_range
            value: "65532 65532"
    containers:
      app:
        image:
          repository: docker.io/cloudflare/cloudflared
          tag: 2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
          pullPolicy: IfNotPresent
        args:
          - tunnel
          - --edge-ip-version
          - "4"
          - run
        env:
          NO_AUTOUPDATE: "true"
          # Inverted flag: false normalizes the request path before ingress rule matching (default true skips it).
          TUNNEL_DISABLE_PATH_NORMALIZATION: "false"
          TUNNEL_METRICS: 0.0.0.0:8080
          TUNNEL_ORIGIN_ENABLE_HTTP2: true
          TUNNEL_POST_QUANTUM: true
          TUNNEL_TRANSPORT_PROTOCOL: quic
          TUNNEL_TOKEN:
            valueFrom:
              secretKeyRef:
                name: cloudflared-secrets
                key: spruyt-labs-01-token
        # Liveness uses /healthcheck: /ready fails while the edge is unreachable, so WAN outages would restart pods.
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthcheck
                port: &port 8080
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /ready
                port: *port
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthcheck
                port: *port
              periodSeconds: 5
              timeoutSeconds: 1
              failureThreshold: 12
        resources:
          requests:
            cpu: 17m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
service:
  app:
    ports:
      http:
        port: *port
serviceMonitor:
  app:
    endpoints:
      - port: http
        scheme: http
        path: /metrics
        interval: 1m
        scrapeTimeout: 10s
