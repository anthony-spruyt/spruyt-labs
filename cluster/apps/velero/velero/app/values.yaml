---
# yaml-language-server: $schema=https://raw.githubusercontent.com/vmware-tanzu/helm-charts/refs/heads/main/charts/velero/values.schema.json

priorityClassName: high-priority

resources:
  requests:
    cpu: 35m
    memory: 216Mi
  limits:
    memory: 1Gi

image:
  repository: docker.io/velero/velero
  tag: v1.18.4@sha256:c89fb5b6d1fd6afd368e0f483e6f5555fd62851a1eada8ac5c72482e674ca17b
  pullPolicy: IfNotPresent

# At least one plugin provider image is required.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.4@sha256:c85a7fa803569e3128c33e4f5766f84ab156c8d171c9f1dd2715581d45ce98fa
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

configuration:
  defaultBackupStorageLocation: aws-primary
  repositoryMaintenanceJob:
    repositoryConfigData:
      global:
        keepLatestMaintenanceJobs: 1
  # Server Deployment only - the chart does not pass these to node-agent
  extraArgs:
    - --backup-repository-configmap=velero-backup-repo-config
  defaultVolumeSnapshotLocations: csi:aws-primary
  logFormat: json
  defaultSnapshotMoveData: true
  features: EnableCSI

credentials:
  useSecret: true
  existingSecret: velero-secret

# BSL and VSL are managed as separate manifests, not by the chart
backupsEnabled: false
snapshotsEnabled: false

deployNodeAgent: true
nodeAgent:
  priorityClassName: high-priority
  extraArgs:
    - --backup-repository-configmap=velero-backup-repo-config
  resources:
    requests:
      cpu: 20m
      memory: 120Mi
    limits:
      memory: 256Mi

configMaps:
  backup-repo-config:
    data:
      kopia: |
        {
          "fullMaintenanceInterval": "eagerGC"
        }
