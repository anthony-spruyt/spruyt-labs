# Default values for vertical-pod-autoscaler
# Chart: https://github.com/kubernetes/autoscaler/tree/master/charts/vertical-pod-autoscaler

admissionController:
  replicas: 1
  priorityClassName: high-priority
  certGen:
    enabled: false
  certManager:
    enabled: true
    createSelfSignedIssuer:
      enabled: true
  # minAvailable: 1 on a single replica blocks node drains, breaking Talos upgrades.
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

recommender:
  replicas: 1
  priorityClassName: high-priority
  extraArgs:
    - --pod-recommendation-min-cpu-millicores=1
    - --pod-recommendation-min-memory-mb=10
    - --storage=prometheus
    - --prometheus-address=http://vmsingle-victoria-metrics-k8s-stack.observability.svc:8428
    - --prometheus-cadvisor-job-name=kubelet
    - --history-length=14d
    - --container-pod-name-label=pod
    - --container-name-label=container
    - --pod-namespace-label=namespace
    - --pod-name-label=pod
    # Subquery returns one recent sample per pod instead of every raw sample across the 14d window.
    # label_move restores the selector keys KSM sanitized; add a pair when a VPA target selects on a new dotted/dashed key.
    - >-
      --metric-for-pod-labels=label_move(last_over_time(kube_pod_labels{job="kube-state-metrics"}[14d]),
      "label_app_kubernetes_io_name", "label_app.kubernetes.io/name",
      "label_app_kubernetes_io_instance", "label_app.kubernetes.io/instance",
      "label_app_kubernetes_io_component", "label_app.kubernetes.io/component",
      "label_app_kubernetes_io_controller", "label_app.kubernetes.io/controller",
      "label_app_kubernetes_io_part_of", "label_app.kubernetes.io/part-of",
      "label_app_kubernetes_io_type", "label_app.kubernetes.io/type",
      "label_kubernetes_io_hostname", "label_kubernetes.io/hostname",
      "label_managed_by", "label_managed-by",
      "label_ceph_osd_id", "label_ceph-osd-id",
      "label_io_cilium_app", "label_io.cilium/app",
      "label_control_plane", "label_control-plane")[1m:1m]
    - --pod-label-prefix=label_
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1024Mi

updater:
  replicas: 1
  priorityClassName: high-priority
  podDisruptionBudget:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1024Mi
