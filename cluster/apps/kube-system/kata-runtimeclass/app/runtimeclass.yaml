---
# The ready label comes from talos/patches/worker machine.nodeLabels, not kubectl label.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
# Kata default_memory (1024 MiB, talos/patches/worker/13-tune-kata-memory.yaml) + 512 MiB; keep in step.
overhead:
  podFixed:
    cpu: 250m
    memory: 1536Mi
scheduling:
  nodeSelector:
    kata.spruyt-labs/ready: "true"
