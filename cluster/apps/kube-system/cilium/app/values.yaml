---
# yaml-language-server: $schema=https://raw.githubusercontent.com/giantswarm/cilium-app/main/helm/cilium/values.schema.json
# Cilium Helm Reference -> https://docs.cilium.io/en/stable/helm-reference/
# Default values for cilium: https://raw.githubusercontent.com/giantswarm/cilium-app/main/helm/cilium/values.yaml
upgradeCompatibility: "1.18"
priorityClassName: system-node-critical
debug:
  enabled: false
rollOutCiliumPods: true
kubeProxyReplacement: true
k8sServicePort: 7445 # KubePrism
k8sServiceHost: localhost # KubePrism
kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
k8s:
  requireIPv4PodCIDR: true
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "${CLUSTER_NODE_CIDR_IP4}"
bpf:
  masquerade: true
  # Reduce aggregation for better drop visibility (default: medium)
  monitorAggregation: low
  monitorInterval: "1s"
  events:
    policyVerdict:
      enabled: true # Record policy verdicts to see which policy caused drops
enableIPv4Masquerade: true
ipMasqAgent:
  enabled: true
  config:
    nonMasqueradeCIDRs:
      - ${CLUSTER_SVC_CIDR_IP4}
      - ${CLUSTER_POD_CIDR_IP4}
      - ${CLUSTER_NODE_CIDR_IP4}
bgpControlPlane:
  enabled: true
gatewayAPI:
  enabled: true
  # Enable ALPN for all listeners configured with Gateway API. ALPN will attempt HTTP/2, then HTTP 1.1.
  # Note that this will also enable appProtocol support, and services that wish to use HTTP/2 will need to indicate that via their appProtocol.
  enableAlpn: true
  enableAppProtocol: true
envoy:
  rollOutPods: true # Envoy reads its bootstrap config (cluster options below) only at start.
  maxRequestsPerConnection: 1 # Pooled upstream connections outlive short-lived client pods; their closing packets then drop as world.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup # https://www.talos.dev/v1.11/kubernetes-guides/network/deploying-cilium/
ipam:
  mode: kubernetes
operator:
  rollOutPods: true
  priorityClassName: system-node-critical
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 50m
      memory: 128Mi
resources:
  requests:
    cpu: 500m
    memory: 1Gi
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    trustCRDsExist: true
certgen:
  priorityClassName: standard
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 30m
      memory: 128Mi
hubble:
  enabled: true
  # Ring buffer for ~23s of flow history at ~2900 flows/s (max 65535, must be 2^n - 1)
  eventBufferCapacity: 65535
  tls:
    auto:
      # Default "helm" reuses the existing Secrets on upgrade, so certs never renew; cronJob reissues them every 4 months
      method: cronJob
  relay:
    enabled: true
    rollOutPods: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
    service:
      targetPort: 9965
  ui:
    enabled: true
    rollOutPods: true
  metrics:
    dashboards:
      enabled: true
      namespace: observability
    enableOpenMetrics: true
    port: 9966
    # Only the dynamic config takes excludeFilters, and the agent rejects it next to a static hubble.metrics.enabled list.
    # Not enabled: tcp, flow, port-distribution, http (high cardinality, not used in alerts/dashboards).
    dynamic:
      enabled: true
      config:
        createConfigMap: true
        content:
          - name: dns
            contextOptions:
              - name: query
              - name: ignoreAAAA
          # Workload context without pod keeps cardinality low.
          - name: drop
            contextOptions:
              - name: sourceContext
                values: [namespace, workload]
              - name: destinationContext
                values: [namespace, workload]
            excludeFilters:
              # Temporal re-dials dead peers on its membership ports for the life of the pod (temporalio/temporal#11429); remove once a release ships the fix (temporalio/temporal#11431).
              # destination_label entries are ORed: matches any destination outside temporal-system, or inside it but not a server pod.
              - source_pod:
                  - temporal-system/temporal-frontend-
                  - temporal-system/temporal-history-
                  - temporal-system/temporal-matching-
                  - temporal-system/temporal-worker-
                destination_port: ["6933", "6934", "6935", "6936", "6937", "6938", "6939"]
                destination_label:
                  - "k8s:io.kubernetes.pod.namespace!=temporal-system"
                  - "k8s:app.kubernetes.io/component notin (frontend,history,matching,worker)"
                drop_reason_desc: ["POLICY_DENIED"]
          - name: icmp
  export:
    dynamic:
      enabled: true
      config:
        createConfigMap: true
        content:
          - name: "policy-drops"
            filePath: "stdout"
            includeFilters:
              - verdict: ["DROPPED"]
                ip_version: ["IPv4"]
            excludeFilters: []
            fieldMask:
              - time
              - source
              - destination
              - IP
              - l4
              - verdict
              - drop_reason
              - drop_reason_desc
              - traffic_direction
socketLB:
  enabled: true
  hostNamespaceOnly: true # Strangely not mentioned in the helm chart reference but it is in the json schema.
wellKnownIdentities:
  enabled: true
securityContext:
  privileged: false
  capabilities:
    ciliumAgent:
      # Use to set socket permission
      - CHOWN
      # Used to terminate envoy child process
      - KILL
      # Used since cilium modifies routing tables, etc...
      - NET_ADMIN
      # Used since cilium creates raw sockets, etc...
      - NET_RAW
      # Used since cilium monitor uses mmap
      - IPC_LOCK
      # We need it for now but might not need it for >= 5.11 specially
      # for the 'SYS_RESOURCE'.
      # In >= 5.8 there's already BPF and PERMON capabilities
      - SYS_ADMIN
      # Could be an alternative for the SYS_ADMIN for the RLIMIT_NPROC
      - SYS_RESOURCE
      # Allow discretionary access control (e.g. required for package installation)
      - DAC_OVERRIDE
      # Allow to set Access Control Lists (ACLs) on arbitrary files (e.g. required for package installation)
      - FOWNER
      # Allow to execute program that changes GID (e.g. required for package installation)
      - SETGID
      # Allow to execute program that changes UID (e.g. required for package installation)
      - SETUID
    mountCgroup:
      # Only used for 'mount' cgroup
      - SYS_ADMIN
      # Used for nsenter
      - SYS_CHROOT
      - SYS_PTRACE
    applySysctlOverwrites:
      # Required in order to access host's /etc/sysctl.d dir
      - SYS_ADMIN
      # Used for nsenter
      - SYS_CHROOT
      - SYS_PTRACE
    cleanCiliumState:
      # Most of the capabilities here are the same ones used in the
      # cilium-agent's container because this container can be used to
      # uninstall all Cilium resources, and therefore it is likely that
      # will need the same capabilities.
      # Used since cilium modifies routing tables, etc...
      - NET_ADMIN
      # We need it for now but might not need it for >= 5.11 specially
      # for the 'SYS_RESOURCE'.
      # In >= 5.8 there's already BPF and PERMON capabilities
      - SYS_ADMIN
      # Could be an alternative for the SYS_ADMIN for the RLIMIT_NPROC
      - SYS_RESOURCE
