---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# Only the LiteLLM proxy may connect to either server. Do not widen it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-litellm-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: db-mcp
  ingress:
    - fromEndpoints:
        # Keep the controller label: every pod in the litellm release carries app.kubernetes.io/name: litellm.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: litellm
            k8s:app.kubernetes.io/name: litellm
            k8s:app.kubernetes.io/controller: litellm
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8002"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-valkey-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: db-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: valkey-system
            k8s:app.kubernetes.io/instance: valkey
            k8s:app.kubernetes.io/name: valkey
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-temporal-cnpg-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: db-mcp
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: temporal-system
            k8s:cnpg.io/cluster: temporal-cnpg-cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
