---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: valkey-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: valkey-system
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: valkey-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-mcp-valkey
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: valkey-secret-store
  target:
    name: db-mcp-valkey
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: valkey-users
        property: mcp
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: temporal-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: temporal-system
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: temporal-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-mcp-temporal
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: temporal-secret-store
  target:
    name: db-mcp-temporal
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: temporal-cnpg-mcp
        property: password
