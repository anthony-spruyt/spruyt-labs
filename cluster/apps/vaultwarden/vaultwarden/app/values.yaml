---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: high-priority
controllers:
  main:
    type: statefulset
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
    containers:
      main:
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        image:
          repository: vaultwarden/server
          tag: 1.37.2-alpine@sha256:d16a304c2476fd787634ddde2c00be8fdfa1a72539438c626ece3686b5b88ab4
        env:
          TZ: ${TIMEZONE}
          DOMAIN: https://vaultwarden.${EXTERNAL_DOMAIN}
          ENABLE_WEBSOCKET: "true"
          PUSH_ENABLED: "true"
          PUSH_RELAY_URI: https://push.bitwarden.com
          PUSH_IDENTITY_URI: https://identity.bitwarden.com
          SIGNUPS_ALLOWED: "false"
          SIGNUPS_VERIFY: "true"
          EMAIL_CHANGE_ALLOWED: "false"
          ORG_EVENTS_ENABLED: "true"
          SSO_ENABLED: "true"
          SSO_ONLY: "true"
          SSO_SIGNUPS_MATCH_EMAIL: "true"
          SSO_SCOPES: openid email profile offline_access
          SSO_PKCE: "true"
          SSO_AUTHORITY: https://auth.${EXTERNAL_DOMAIN}/application/o/vaultwarden/
        envFrom:
          - secretRef:
              name: vaultwarden-secrets
          - secretRef:
              name: vaultwarden-oauth-credentials
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /alive
                port: &port 80
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3
          readiness: *probes
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 2Gi
service:
  vaultwarden:
    controller: main
    ports:
      http:
        port: *port
persistence:
  data:
    existingClaim: vaultwarden-data-v2
    globalMounts:
      - path: /data
  tmp:
    type: emptyDir
