---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# The plugin reaches the kubelet over a unix socket on a hostPath mount and needs no network.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-all
  namespace: intel-gpu-plugin
spec:
  endpointSelector: {}
  ingressDeny:
    - {}
  egressDeny:
    - {}
