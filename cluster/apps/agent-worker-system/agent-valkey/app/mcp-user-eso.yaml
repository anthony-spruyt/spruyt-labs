---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: agent-valkey-mcp-password
spec:
  length: 64
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Merges the `mcp` key into the SOPS-managed users secret; a SOPS edit re-syncs and regenerates it
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-valkey-mcp
spec:
  refreshPolicy: CreatedOnce
  target:
    name: agent-valkey-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      data:
        mcp: "sl_{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: agent-valkey-mcp-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/role-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-mcp-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["agent-valkey-secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/rolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-mcp-secret-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-mcp-secret-reader
subjects:
  - kind: ServiceAccount
    name: agent-valkey-secret-reader
    namespace: db-mcp
