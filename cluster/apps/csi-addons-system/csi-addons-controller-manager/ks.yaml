---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app csi-addons-controller-manager
  namespace: flux-system
spec:
  targetNamespace: csi-addons-system
  path: ./cluster/apps/csi-addons-system/csi-addons-controller-manager/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  prune: true
  timeout: 5m
  wait: false
---
# csi-addons CRDs. Talos seeds them at bootstrap; Flux owns updates.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-addons-crds
  namespace: flux-system
  labels:
    kustomizationdefaults.flux.home.arpa/disabled: "true"
    substitution.flux.home.arpa/disabled: "true"
    sops.flux.home.arpa/disabled: "true"
spec:
  interval: 4h
  sourceRef:
    kind: GitRepository
    name: csi-addons-gitrepo
    namespace: flux-system
  path: ./deploy/controller
  prune: false
  timeout: 5m
  wait: true
