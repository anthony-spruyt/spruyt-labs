---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hindsight
  namespace: flux-system
spec:
  targetNamespace: hindsight
  path: ./cluster/apps/hindsight/hindsight/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cnpg-operator
    - name: external-secrets
    - name: plugin-barman-cloud
    - name: traefik
    - name: authentik
  prune: true
  timeout: 5m
  # A hibernated CNPG cluster never reports Ready, so health checks can only time out,
  # and traefik-ingress dependsOn this Kustomization. Set back to true when clearing
  # cnpg.io/hibernation on hindsight-cnpg-cluster.yaml.
  wait: false
