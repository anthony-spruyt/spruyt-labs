---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-cnpg-cluster
  annotations:
    # Hindsight application is scaled to 0; keep PVCs, drop the Postgres pods.
    # To bring the cluster back: set to "off", unsuspend the ScheduledBackup,
    # and re-enable monitoring.enablePodMonitor below.
    cnpg.io/hibernation: "on"
spec:
  imageName: "ghcr.io/cloudnative-pg/postgresql:18@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533"
  instances: 2
  enablePDB: false
  monitoring:
    # Disabled while hibernated: no instances means an empty scrape pool,
    # which fires ScrapePoolHasNoTargets.
    enablePodMonitor: false
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: hindsight-cnpg-aws-object-store
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
  managed:
    roles:
      - name: hindsight
        login: true
        connectionLimit: -1
        ensure: present
        inherit: true
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.2-18-trixie
    parameters:
      # maintenance_work_mem: 8GB
      shared_buffers: 256MB
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 200m
      memory: 1Gi
  storage:
    pvcTemplate:
      storageClassName: rbd-fast-delete
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
