---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: low-priority
  securityContext:
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: "OnRootMismatch"
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
controllers:
  mcp-victoriametrics:
    strategy: Recreate
    containers:
      app:
        image:
          repository: ghcr.io/victoriametrics/mcp-victoriametrics
          tag: v1.20.2@sha256:bcbf84f945d6efb03fb8b2d2ccc3294420dccdc0b445752dce96f02619416dfe
          pullPolicy: IfNotPresent
        env:
          - name: VM_INSTANCE_ENTRYPOINT
            value: "http://vmsingle-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428"
          - name: VM_INSTANCE_TYPE
            value: "single"
          - name: MCP_SERVER_MODE
            value: "http"
          - name: MCP_LISTEN_ADDR
            value: ":8080"
          # info logs every tool result, which ships back into VictoriaLogs
          - name: MCP_LOG_LEVEL
            value: "warn"
        resources:
          requests:
            cpu: 25m
            memory: 640Mi
          limits:
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health/liveness
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health/readiness
                port: 8080
              initialDelaySeconds: 5
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
service:
  app:
    controller: mcp-victoriametrics
    ports:
      http:
        port: 8080
