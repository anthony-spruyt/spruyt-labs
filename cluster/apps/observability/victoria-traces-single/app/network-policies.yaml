# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-agent-platform-traces-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vt-single
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-platform
          matchExpressions:
            - key: k8s:app.kubernetes.io/name
              operator: In
              values:
                - agent-platform-web
                - agent-platform-worker
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: agent-platform-agents
            k8s:managed-by: agent-platform
      toPorts:
        - ports:
            - port: "10428"
              protocol: TCP
