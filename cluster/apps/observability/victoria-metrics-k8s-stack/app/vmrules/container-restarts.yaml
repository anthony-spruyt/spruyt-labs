---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: container-restarts
  namespace: observability
spec:
  groups:
    - name: container-restart-alerts
      rules:
        - alert: ContainerRestartsRecurring
          # Not increase(): VM seeds new series from 0, so a kube-state-metrics restart reads lifetime totals as new
          # The 900s clause skips containers started within 15m of the pod or node boot; KubePodCrashLooping covers those
          # host_ip joins kube_pod_info to node-exporter's instance; no node boot series falls back to the pod start
          # last_over_time: KSM drops state_started while a container waits in CrashLoopBackOff
          expr: |
            (
              max by (namespace, pod, container) (
                increase_prometheus(kube_pod_container_status_restarts_total[24h])
              ) >= 2
            )
            and on (namespace, pod, container)
            (
              max by (namespace, pod, container) (
                kube_pod_container_status_last_terminated_reason{reason=~"Error|ContainerCannotRun|StartError"}
              ) == 1
            )
            and on (namespace, pod, container)
            (
              (
                max by (namespace, pod, container) (last_over_time(kube_pod_container_state_started[1h]))
                - on (namespace, pod) group_left
                max by (namespace, pod) (
                  max by (namespace, pod) (kube_pod_start_time)
                  or
                  max by (namespace, pod, host_ip) (kube_pod_info)
                  * on (host_ip) group_left ()
                  max by (host_ip) (label_replace(node_boot_time_seconds, "host_ip", "$1", "instance", "(.+):9100"))
                )
              ) > 900
            )
          for: 0m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted {{ printf \"%.0f\" $value }}x in 24h"
            description: >-
              Container {{ $labels.container }} in pod {{ $labels.pod }}
              (namespace {{ $labels.namespace }}) restarted
              {{ printf "%.0f" $value }} times in the last 24h.
              Check the previous container's logs and last terminated reason.
