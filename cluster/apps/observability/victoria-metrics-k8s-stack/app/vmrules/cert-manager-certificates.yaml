---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/operator.victoriametrics.com/vmrule_v1beta1.json
# Requires VMServiceScrape for cert-manager controller metrics (certmanager_*)
# That scrape puts the Certificate's namespace in exported_namespace; label_replace moves it back
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cert-manager-certificates
  namespace: observability
spec:
  groups:
    - name: cert-manager-certificates
      rules:
        - alert: CertificateNotReady
          expr: |
            max by (name, namespace) (
              label_replace(
                certmanager_certificate_ready_status{condition="False"} == 1,
                "namespace", "$1", "exported_namespace", "(.+)"
              )
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not Ready"
            description: |
              cert-manager Certificate {{ $labels.namespace }}/{{ $labels.name }} has been in a
              non-Ready state for more than 15 minutes. Check certificate requests and orders.

        # Not a fixed "expires in < N days" threshold - that false-fires on certs issued for < N days
        - alert: CertificateRenewalOverdue
          expr: |
            max by (name, namespace) (
              label_replace(
                (time() - certmanager_certificate_renewal_timestamp_seconds) > 0
                and
                (certmanager_certificate_expiration_timestamp_seconds - time()) > 0,
                "namespace", "$1", "exported_namespace", "(.+)"
              )
            )
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is overdue for renewal"
            description: |
              cert-manager Certificate {{ $labels.namespace }}/{{ $labels.name }} passed its
              renewal time {{ $value | humanizeDuration }} ago and has not been reissued.
              Renewal is likely failing. Check certificate requests and orders.

        # Expiry is 0 until first issuance; CertificateNotReady covers that window
        - alert: CertificateExpired
          expr: |
            max by (name, namespace) (
              label_replace(
                (certmanager_certificate_expiration_timestamp_seconds - time()) < 0
                and
                certmanager_certificate_expiration_timestamp_seconds > 0,
                "namespace", "$1", "exported_namespace", "(.+)"
              )
            )
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} has expired"
            description: |
              cert-manager Certificate {{ $labels.namespace }}/{{ $labels.name }} has expired.
              Services using this certificate will have TLS errors.
