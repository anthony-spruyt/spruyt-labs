---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shutdown-orchestrator
  namespace: nut-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shutdown-orchestrator
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  # Drain deletes pods in any namespace; without it Ceph scale-down is skipped on power loss
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: shutdown-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: shutdown-orchestrator
subjects:
  - kind: ServiceAccount
    name: shutdown-orchestrator
    namespace: nut-system
