---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey-secret-reader
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-valkey-secret-reader
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/serviceaccount-v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-valkey-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: valkey-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: valkey-system
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: valkey-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: agent-valkey-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: agent-worker-system
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: agent-valkey-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: litellm-valkey-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: litellm
      server:
        url: "https://kubernetes.default.svc"
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: litellm-valkey-secret-reader
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Keep the ids stable - RedisInsight upserts pre-setup databases by id and deletes any id no longer listed
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redisinsight-config
spec:
  refreshInterval: 5m
  target:
    name: redisinsight-config
    creationPolicy: Owner
    template:
      data:
        config.json: |
          [
            {
              "id": "0a6add43-40fb-49cd-9868-edd5905f9e6e",
              "name": "valkey.valkey-system.svc:6379",
              "host": "valkey.valkey-system.svc",
              "port": 6379,
              "username": "redisinsight",
              "password": {{ .valkey | toJson }}
            },
            {
              "id": "71f36dcb-3a2c-4755-aa71-89b73516c5d3",
              "name": "agent-valkey.agent-worker-system.svc:6379",
              "host": "agent-valkey.agent-worker-system.svc",
              "port": 6379,
              "username": "redisinsight",
              "password": {{ .agentValkey | toJson }}
            },
            {
              "id": "a4e70cce-d641-48de-8fc1-88293e2c17c8",
              "name": "litellm-valkey.litellm.svc:6379",
              "host": "litellm-valkey.litellm.svc",
              "port": 6379,
              "username": "redisinsight",
              "password": {{ .litellmValkey | toJson }}
            }
          ]
  data:
    - secretKey: valkey
      sourceRef:
        storeRef:
          kind: SecretStore
          name: valkey-secret-store
      remoteRef:
        key: valkey-users
        property: redisinsight
    - secretKey: agentValkey
      sourceRef:
        storeRef:
          kind: SecretStore
          name: agent-valkey-secret-store
      remoteRef:
        key: agent-valkey-users
        property: redisinsight
    - secretKey: litellmValkey
      sourceRef:
        storeRef:
          kind: SecretStore
          name: litellm-valkey-secret-store
      remoteRef:
        key: litellm-valkey-secrets
        property: redisinsight
