---
# Default values: https://github.com/bjw-s-labs/helm-charts/blob/main/charts/library/common/values.yaml
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
defaultPodOptions:
  priorityClassName: low-priority
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: "OnRootMismatch"
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

controllers:
  redisinsight:
    annotations:
      reloader.stakater.com/auto: "true"
    strategy: Recreate
    serviceAccount:
      identifier: redisinsight
    containers:
      app:
        image:
          repository: redis/redisinsight
          tag: 3.10.0@sha256:f00fdc1de63baad22ad2c3eeceede2bcf8859db0b45657033ea70e354f6b9173
          pullPolicy: IfNotPresent
        env:
          - name: RI_FILES_LOGGER
            value: "false"
          - name: RI_STDOUT_LOGGER
            value: "true"
          - name: RI_PRE_SETUP_DATABASES_PATH
            value: /usr/src/app/config.json
          # No PVC, so the EULA would reset each restart; pre-setup databases stay hidden until it is accepted
          - name: RI_ACCEPT_TERMS_AND_CONDITIONS
            value: "true"
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          # No readOnlyRootFilesystem - SQLite fails with SQLITE_CANTOPEN
          capabilities:
            drop:
              - ALL
        probes:
          liveness: &probes
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /api/health
                port: 5540
              initialDelaySeconds: 10
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readiness: *probes

serviceAccount:
  redisinsight:
    enabled: true

persistence:
  config:
    type: secret
    name: redisinsight-config
    advancedMounts:
      redisinsight:
        app:
          - path: /usr/src/app/config.json
            subPath: config.json
            readOnly: true

service:
  app:
    # A Service named redisinsight injects REDISINSIGHT_HOST/PORT env vars that clash with the app's own
    suffix: svc
    controller: redisinsight
    ports:
      http:
        port: 5540
