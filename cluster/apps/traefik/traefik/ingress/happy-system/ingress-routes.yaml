---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/traefik.io/ingressroute_v1alpha1.json
# Public with no forward auth: the Happy apps talk to the server directly and authenticate with their own keys.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingress-routes-wan-https
  namespace: happy-system
  annotations:
    cert-manager.io/cluster-issuer: ${CLUSTER_ISSUER}
    external-dns.kubernetes.io/hostname: happy.${EXTERNAL_DOMAIN}
    external-dns.kubernetes.io/target: ${TRAEFIK_IP4}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`happy.${EXTERNAL_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: compress
      services:
        - name: happy-server
          namespace: happy-system
          passHostHeader: true
          port: 3005
  tls:
    secretName: "happy-${EXTERNAL_DOMAIN/./-}-tls"
