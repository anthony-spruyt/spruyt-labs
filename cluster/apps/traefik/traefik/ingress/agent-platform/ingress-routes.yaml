---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/traefik.io/ingressroute_v1alpha1.json
# Documentation: https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/crd/http/ingressroute/
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingress-routes-wan-https
  namespace: agent-platform
  annotations:
    cert-manager.io/cluster-issuer: ${CLUSTER_ISSUER}
    external-dns.kubernetes.io/hostname: hooks.${EXTERNAL_DOMAIN}
    external-dns.kubernetes.io/target: ${TRAEFIK_IP4}
spec:
  entryPoints:
    - websecure
  routes:
    # No SSO: the app verifies the GitHub HMAC signature itself
    - kind: Rule
      match: Host(`hooks.${EXTERNAL_DOMAIN}`) && Path(`/webhooks/github`)
      services:
        - name: agent-platform-web
          namespace: agent-platform
          passHostHeader: true
          port: 8080
  tls:
    secretName: "hooks-${EXTERNAL_DOMAIN/./-}-tls"
