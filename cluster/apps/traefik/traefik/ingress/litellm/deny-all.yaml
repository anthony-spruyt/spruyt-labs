---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/traefik.io/middleware_v1alpha1.json
# Traefik has no deny middleware; an allowlist no client IP can match rejects every request with 403.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: deny-all
  namespace: litellm
spec:
  ipAllowList:
    sourceRange:
      - 0.0.0.0/32
