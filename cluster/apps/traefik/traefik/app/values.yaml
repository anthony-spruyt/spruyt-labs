---
# yaml-language-server: $schema=https://raw.githubusercontent.com/traefik/traefik-helm-chart/refs/heads/master/traefik/values.schema.json
# Default values for traefik: https://github.com/traefik/traefik-helm-chart/blob/master/traefik/values.yaml
priorityClassName: critical-infrastructure
podSecurityContext:
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
log:
  format: json
  level: INFO
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi
tracing:
  otlp:
    enabled: true
    http:
      enabled: true
      endpoint: http://victoria-traces-single-vt-single-server.observability.svc:10428/insert/opentelemetry/v1/traces
metrics:
  prometheus:
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
ports:
  # aliasHeadersStrategy mitigates GHSA-rf44-j88r-hh8c: clients can spoof
  # ForwardAuth identity headers (X-authentik-*) using underscore or dot
  # aliases that CGI-style backends fold onto the canonical header name.
  # "delete" strips header names containing non-alphanumeric, non-dash
  # characters. Traefik defaults to "keep" for backwards compatibility and
  # warns on every entry point where this is unset, so set it explicitly.
  traefik:
    http:
      aliasHeadersStrategy: delete
  metrics:
    http:
      aliasHeadersStrategy: delete
  web:
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    http:
      aliasHeadersStrategy: delete
    forwardedHeaders:
      trustedIPs:
        - "${CLUSTER_POD_CIDR_IP4}"
providers:
  kubernetesCRD:
    allowCrossNamespace: false
    safeNaming: true
service:
  annotations:
    lbipam.cilium.io/ips: "${TRAEFIK_IP4}"
  spec:
    externalTrafficPolicy: Local
tlsStore:
  default:
    defaultCertificate:
      secretName: "wildcard-${EXTERNAL_DOMAIN/./-}-tls"
deployment:
  replicas: 2
  lifecycle:
    preStop:
      sleep:
        seconds: 5
  additionalVolumes:
    - name: traefik-api-key-auth-plugin
      image:
        reference: docker.io/aspruyt/traefik-api-key-auth:1.0.1@sha256:75c99966fb4e2bd019c2136ab3f9e77c7f918b15d7f081a32d9db6f048c17a3a
        pullPolicy: IfNotPresent
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys:
      - pod-template-hash
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
experimental:
  localPlugins:
    traefik-api-key-auth:
      moduleName: "github.com/anthony-spruyt/traefik-api-key-auth"
      mountPath: /plugins-local/src/github.com/anthony-spruyt/traefik-api-key-auth
      type: localPath
      volumeName: traefik-api-key-auth-plugin
env:
  - name: OTEL_API_KEY
    valueFrom:
      secretKeyRef:
        name: traefik-otel-api-key
        key: OTEL_API_KEY
