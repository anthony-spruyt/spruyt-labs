---
# yaml-language-server: $schema=https://k8s-schemas-cjso.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coder
spec:
  chart:
    spec:
      chart: coder
      # Stable channel only — mainline charts are published to the same Helm repo
      # with indistinguishable semver, so the flux manager is disabled for this
      # chart and the version is tracked via the coder-stable custom datasource
      # (GitHub "latest release" pointer). See .github/renovate-overrides.json5
      # renovate: datasource=custom.coder-stable depName=coder
      version: "2.35.6"
      sourceRef:
        kind: HelmRepository
        name: coder-charts
        namespace: flux-system
  interval: 4h
  valuesFrom:
    - kind: ConfigMap
      name: coder-values
  # Inject hostAliases so Coder resolves code.$EXTERNAL_DOMAIN to Traefik LB internally
  # (avoids Cloudflare hairpin for health checks and DERP)
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: coder
            patch: |
              - op: add
                path: /spec/template/spec/hostAliases
                value:
                  - ip: "${TRAEFIK_IP4}"
                    hostnames:
                      - "code.${EXTERNAL_DOMAIN}"
