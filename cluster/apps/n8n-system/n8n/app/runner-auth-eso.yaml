---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: n8n-runner-auth-password
spec:
  length: 64
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-runner-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: n8n-runner-auth
    creationPolicy: Orphan
    immutable: true
    template:
      data:
        N8N_RUNNERS_AUTH_TOKEN: "sl_{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: n8n-runner-auth-password
