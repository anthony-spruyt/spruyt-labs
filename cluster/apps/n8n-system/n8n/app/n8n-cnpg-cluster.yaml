---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-cnpg-cluster
spec:
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-cnpg-owner
  certificates:
    serverAltDNSNames:
      - n8n-cnpg-cluster-pooler-rw
      - n8n-cnpg-cluster-pooler-rw.n8n-system
      - n8n-cnpg-cluster-pooler-rw.n8n-system.svc
      - n8n-cnpg-cluster-pooler-ro
      - n8n-cnpg-cluster-pooler-ro.n8n-system
      - n8n-cnpg-cluster-pooler-ro.n8n-system.svc
  enableSuperuserAccess: false
  imageName: "ghcr.io/cloudnative-pg/postgresql:18@sha256:899d3ed526b659d77935dde0e6bf2d69dbbf17d3d8c6486ca8cfd04bd3c18533"
  instances: 2
  enablePDB: false
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: n8n-cnpg-aws-object-store
  postgresql:
    parameters:
      shared_buffers: 256MB
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 85m
      memory: 640Mi
  storage:
    pvcTemplate:
      storageClassName: rbd-fast-delete
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 3Gi
