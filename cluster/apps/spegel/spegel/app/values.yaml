# #yaml-language-server: $schema=TODO
# Default values for spegel: https://github.com/spegel-org/spegel/blob/main/charts/spegel/values.yaml
# Values documentation: https://artifacthub.io/packages/helm/spegel/spegel
priorityClassName: high-priority
resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    memory: 128Mi
service:
  registry:
    hostPort: 0
    usePreferSameNodeTrafficDistribution: true
serviceMonitor:
  enabled: true
grafanaDashboard:
  enabled: false # Disabled: 0.7.0 dashboard uses DS_PROMETHEUS placeholders incompatible with VictoriaMetrics sidecar mode (spegel-org/spegel#1303)
spegel:
  # Talos doesn't use the usual /etc/containerd/certs.d directory for its CRI mirror config.
  # Instead Talos's Containerd integration reads host entries from /etc/cri/conf.d/hosts.
  containerdRegistryConfigPath: "/etc/cri/conf.d/hosts"
  resolveTags: false
  debugWebEnabled: false
