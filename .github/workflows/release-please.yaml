# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# This file is automatically updated - do not modify directly

name: "Release Please"
on:
  push:
    branches:
      - "main"
  workflow_dispatch: {}
  schedule:
    - cron: "23 */6 * * *"
concurrency:
  group: "release-please-${{ github.ref }}"
  cancel-in-progress: false
permissions: {}
jobs:
  release:
    permissions:
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-please.yaml@6364775b2e73a9cd1bf3cb639a6c8c12a5cda41b"
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
      RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
    if: "github.ref_type == 'branch'"
  recover:
    needs: "release"
    if: "!cancelled()"
    permissions:
      contents: "read"
      actions: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-recover.yaml@6364775b2e73a9cd1bf3cb639a6c8c12a5cda41b"
    with:
      releases: "${{ needs.release.outputs.releases }}"
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID: "${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}"
      RELEASE_PLEASE_APP_PRIVATE_KEY: "${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}"
  images:
    needs:
      - "release"
      - "recover"
    if: "!cancelled() && (needs.release.outputs.release-created == 'true' || needs.recover.outputs.release-created == 'true')"
    permissions:
      contents: "write"
      packages: "write"
      id-token: "write"
      attestations: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_release-images.yaml@6364775b2e73a9cd1bf3cb639a6c8c12a5cda41b"
    with:
      releases: "${{ needs.recover.outputs.releases || needs.release.outputs.releases }}"
      language: "none"
      dockerhub-namespace: "aspruyt"
    secrets:
      DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
