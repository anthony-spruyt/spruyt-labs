# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# This file is automatically updated - do not modify directly

name: "Container Retention"
on:
  schedule:
    - cron: "0 17 * * 6"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting it"
        type: "boolean"
        default: true
permissions: {}
jobs:
  cleanup:
    permissions:
      packages: "write"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_container-retention.yaml@cb40ddc2ff6cd9f0441cd59406c849c68f6bd464"
    with:
      packages: "shutdown-orchestrator,agent-queue-worker,bull-board"
      dry-run: "${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}"
