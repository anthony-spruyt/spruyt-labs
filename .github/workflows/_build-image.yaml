# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json

name: "Build Image"
on:
  workflow_call:
    inputs:
      image:
        description: "Image name (e.g., shutdown-orchestrator)"
        required: true
        type: "string"
      workdir:
        description: "Build context path (e.g., cmd/shutdown-orchestrator)"
        required: true
        type: "string"
      language:
        description: "node or go"
        required: true
        type: "string"
      push:
        description: "Publish the image and the release. Off for pull request checks."
        required: false
        type: "boolean"
        default: false
      version:
        description: "Version to publish, without a leading v (e.g., 1.1.24). Required when push is true."
        required: false
        type: "string"
        default: ""
      tag-name:
        description: "Git tag release-please created (e.g., shutdown-orchestrator/v1.1.24). Must point at the commit the run started from. Required when push is true."
        required: false
        type: "string"
        default: ""
    outputs:
      digest:
        description: "Image digest (empty unless push is true)"
        value: "${{ jobs.publish.outputs.digest }}"
concurrency:
  group: "build-${{ inputs.image }}-${{ inputs.version || github.ref }}"
  cancel-in-progress: false
jobs:
  test-node:
    name: "Test"
    if: "inputs.language == 'node'"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false
      - name: "Setup Node.js"
        uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7
        with:
          node-version: "24"
      - name: "Install dependencies"
        working-directory: "${{ inputs.workdir }}"
        run: npm ci --ignore-scripts
      - name: "Type check"
        working-directory: "${{ inputs.workdir }}"
        run: ./node_modules/.bin/tsc --noEmit
      - name: "Run tests"
        working-directory: "${{ inputs.workdir }}"
        env:
          WORKDIR: "${{ inputs.workdir }}"
        run: |
          if node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            npm test
          else
            echo "::notice::No test script in ${WORKDIR}/package.json, skipping tests"
          fi
  test-go:
    name: "Test"
    if: "inputs.language == 'go'"
    permissions:
      contents: "read"
    uses: "anthony-spruyt/repo-operator/.github/workflows/_go-test.yaml@main"
    with:
      workdir: "${{ inputs.workdir }}"
  build:
    name: "Build"
    needs:
      - "test-node"
      - "test-go"
    # Exactly one test job runs; a skipped need makes the implicit success() false.
    if: |
      !cancelled() && !inputs.push &&
      (needs.test-node.result == 'success' || needs.test-node.result == 'skipped') &&
      (needs.test-go.result == 'success' || needs.test-go.result == 'skipped')
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false
      - name: "Build image"
        uses: "anthony-spruyt/repo-operator/.github/actions/build-image@main"
        with:
          image: "${{ inputs.image }}"
          context: "${{ inputs.workdir }}"
          version: "${{ inputs.version }}"
          go-mod: "${{ inputs.language == 'go' && format('{0}/go.mod', inputs.workdir) || '' }}"
  publish:
    name: "Build and publish"
    needs:
      - "test-node"
      - "test-go"
    if: |
      !cancelled() && inputs.push &&
      (needs.test-node.result == 'success' || needs.test-node.result == 'skipped') &&
      (needs.test-go.result == 'success' || needs.test-go.result == 'skipped')
    runs-on: "ubuntu-latest"
    # No permissions block: requesting write here fails read-only PR callers at startup, even though the job is skipped.
    outputs:
      digest: "${{ steps.build.outputs.digest }}"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          persist-credentials: false
      # The test jobs check out the run's commit, so the tag must be that commit for the tests to cover the image.
      - name: "Verify the tag is the commit being built"
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          TAG_NAME: "${{ inputs.tag-name }}"
          VERSION: "${{ inputs.version }}"
        run: |
          if [ -z "$TAG_NAME" ] || [ -z "$VERSION" ]; then
            echo "::error::tag-name and version are required when push is true"
            exit 1
          fi
          TAG_SHA=$(gh api "repos/${GH_REPO}/commits/refs/tags/${TAG_NAME}" --jq .sha)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::Tag ${TAG_NAME} is ${TAG_SHA}, but this run checked out ${HEAD_SHA}. Run Rebuild Release from the tag."
            exit 1
          fi
      - name: "Build and push image"
        id: "build"
        uses: "anthony-spruyt/repo-operator/.github/actions/build-image@main"
        with:
          image: "${{ inputs.image }}"
          context: "${{ inputs.workdir }}"
          push: "true"
          version: "${{ inputs.version }}"
          go-mod: "${{ inputs.language == 'go' && format('{0}/go.mod', inputs.workdir) || '' }}"
      # Must stay last: on failure the release stays a draft, so a published release always has an image.
      - name: "Publish release"
        uses: "anthony-spruyt/repo-operator/.github/actions/publish-release@main"
        with:
          tag: "${{ inputs.tag-name }}"
          image-ref: "${{ steps.build.outputs.image-ref }}"
          digest: "${{ steps.build.outputs.digest }}"
