# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
name: "Go Tests"
on:
  workflow_call:
    inputs:
      workdir:
        description: "Module directory (e.g., cmd/mcp-header-proxy)"
        required: true
        type: "string"
      ref:
        description: "Git ref to check out. Defaults to the triggering ref."
        required: false
        type: "string"
        default: ""
permissions:
  contents: "read"
jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
        with:
          egress-policy: audit
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7
        with:
          ref: "${{ inputs.ref }}"
      - name: "Setup Go"
        uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7
        with:
          go-version-file: "${{ inputs.workdir }}/go.mod"
          # setup-go throws, not warns, when no path resolves. Dependency-free
          # modules have no go.sum, so go.mod must be listed to keep the hash
          # non-empty.
          cache-dependency-path: |
            ${{ inputs.workdir }}/go.mod
            ${{ inputs.workdir }}/go.sum
      - name: "Run tests"
        working-directory: "${{ inputs.workdir }}"
        run: go test -race ./...
