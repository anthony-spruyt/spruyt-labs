---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  ciliumScriptsDir: "{{ .ROOT_DIR }}/.taskfiles/cilium/scripts"

tasks:
  status:
    desc: Show Hubble status and flow buffer capacity
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-status.sh

  drops:
    desc: Show recent dropped flows (last 100 per node)
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-drops.sh

  drops-live:
    desc: Stream dropped flows in real-time
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-drops-live.sh
    interactive: true

  drops-ns:
    desc: Show drops to or from a specific namespace (last 100 per node, pass namespace as CLI_ARGS)
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-drops-ns.sh {{.CLI_ARGS}}

  drops-json:
    desc: Show drops with full JSON detail (last 50 per node, for debugging policy issues)
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-drops-json.sh

  drops-policy:
    desc: Show drops with policy match info (last 100 per node)
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-drops-policy.sh

  flows:
    desc: Show recent flows (last 100 per node)
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-flows.sh

  flows-ns:
    desc: Show flows to or from a specific namespace (last 100 per node, pass namespace as CLI_ARGS)
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-flows-ns.sh {{.CLI_ARGS}}

  policy-drops:
    desc: Show only policy-related drops (last 100 per node)
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-policy-drops.sh

  relay-forward:
    desc: Port-forward Hubble Relay for local CLI access
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-relay-forward.sh
    interactive: true

  connectivity-test:
    desc: Run Cilium connectivity test (creates test namespace)
    cmds:
      - bash {{ .ciliumScriptsDir }}/connectivity-test.sh

  connectivity-test-cleanup:
    desc: Clean up leftover namespaces from failed connectivity tests
    cmds:
      - bash {{ .ciliumScriptsDir }}/connectivity-test-cleanup.sh

  buffer-status:
    desc: Check Hubble ring buffer utilization across all nodes
    cmds:
      - bash {{ .ciliumScriptsDir }}/hubble-buffer-status.sh
