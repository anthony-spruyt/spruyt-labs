---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  scriptsDir: "{{ .ROOT_DIR }}/.taskfiles/talos/scripts"

tasks:
  render:
    desc: Render machine configs to talos/clusterconfig/topf for inspection
    cmds:
      - bash {{ .scriptsDir }}/render.sh
  diff:
    desc: Show what a Talos config apply would change (NODE=<regex> to filter; exits non-zero when there is drift)
    cmds:
      - NODE='{{ .NODE }}' bash {{ .scriptsDir }}/apply.sh --dry-run
  apply:
    desc: Apply Talos config (NODE=<regex> to filter, e.g. NODE=ms-01-1)
    cmds:
      - NODE='{{ .NODE }}' bash {{ .scriptsDir }}/apply.sh
  schematic-ids:
    desc: Print the distinct Image Factory schematic IDs in use (sorted, unlabelled - ignores NODE)
    cmds:
      - bash {{ .scriptsDir }}/topf.sh schematic-ids
  talosconfig:
    desc: Regenerate talosconfig from the secrets bundle and merge it locally
    cmds:
      - bash {{ .scriptsDir }}/talosconfig.sh
