# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

[extend]
# https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml
useDefault = true

# --- Global Allowlists ---
# Repo-specific paths consolidated here for central management.
[allowlist]
paths = [
  # spruyt-labs: ExternalSecret CRDs contain key references, not secret values
  '''external-secret\.yaml$''',
  '''talos/clusterconfig/''',
]

# --- IP/CIDR Leakage Prevention ---
# Prevents private IP addresses from being committed to public repositories.

[[rules]]
id = "private-ip-rfc1918-10"
description = "RFC1918 private IP address (10.x.x.x)"
regex = '''\b10\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})(?:/[0-9]{1,2})?\b'''
tags = ["ip-leakage"]

  [rules.allowlist]
  paths = [
    '''talos/''',
    '''\.sops\.yaml$''',
  ]
  # Generic RFC1918 aggregate, not a network detail
  regexes = [
    '''^10\.0\.0\.0/8$''',
  ]

[[rules]]
id = "private-ip-rfc1918-172"
description = "RFC1918 private IP address (172.16-31.x.x)"
regex = '''\b172\.(?:1[6-9]|2[0-9]|3[01])\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})(?:/[0-9]{1,2})?\b'''
tags = ["ip-leakage"]

  [rules.allowlist]
  paths = [
    '''talos/''',
    '''\.sops\.yaml$''',
  ]
  # Generic RFC1918 aggregate, not a network detail
  regexes = [
    '''^172\.16\.0\.0/12$''',
  ]

[[rules]]
id = "private-ip-rfc1918-192"
description = "RFC1918 private IP address (192.168.x.x)"
regex = '''\b192\.168\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})\.(?:25[0-5]|2[0-4][0-9]|[01]?[0-9]{1,2})(?:/[0-9]{1,2})?\b'''
tags = ["ip-leakage"]

  [rules.allowlist]
  paths = [
    '''talos/''',
    '''\.sops\.yaml$''',
  ]
  # Generic RFC1918 aggregate, not a network detail
  regexes = [
    '''^192\.168\.0\.0/16$''',
  ]

# --- Generated Secrets ---
# Must match _PATTERNS in anthony-spruyt/litellm-middleware secret_masking.py and `task sops:gen-key`.

[[rules]]
id = "spruyt-labs-secret"
description = "Spruyt Labs generated secret (sl_ prefix)"
regex = '''(?:^|[^A-Za-z0-9_])(sl_[A-Za-z0-9]{29,})(?:[^A-Za-z0-9]|$)'''
secretGroup = 1
keywords = ["sl_"]
tags = ["secret"]
